[data-tooltip]{position:relative;}
[data-tooltip]:hover::after{
  content:attr(data-tooltip);
  position:absolute;
  left:50%;
  bottom:calc(100% + 10px);
  transform:translateX(-50%);
  background:#fff;
  color:var(--pink);
  border:2px solid var(--pink);
  border-radius:10px;
  padding:6px 12px;

ぎんいろ","kana":null,"en":"Silver","short":"silver"},{"jp":"しろ","kana":null,"en":"White","short":"white"},{"jp":"きいろ","kana":null,"en":"Yellow","short":"yellow"}],"animals":[{"jp":"ぺっと","kana":null,"en":"Pet","short":"pets","note":"Usually written ペット in katakana."},{"jp":"とり","kana":null,"en":"Bird","short":"birds"},{"jp":"ねこ","kana":null,"en":"Cat","short":"cats"},{"jp":"うし","kana":null,"en":"Cow","short":"cows"},{"jp":"いぬ","kana":null,"en":"Dog","short":"dogs"},{"jp":"たつ","kana":null,"en":"Dragon","short":"dragons"},{"jp":"さかな","kana":null,"en":"Fish","short":"fish"},{"jp":"さる","kana":null,"en":"Monkey","short":"monkeys"},{"jp":"ねずみ","kana":null,"en":"Mouse / rat","short":"mice"},{"jp":"ぶた","kana":null,"en":"Pig","short":"pigs"},{"jp":"うさぎ","kana":null,"en":"Rabbit / bunny","short":"rabbits"},{"jp":"ひつじ","kana":null,"en":"Sheep","short":"sheep"},{"jp":"へび","kana":null,"en":"Snake","short":"snakes"},{"jp":"とら","kana":null,"en":"Tiger","short":"tigers"},{"jp":"いのしし","kana":null,"en":"Wild boar / boar","accept":["pig"],"short":"wild boar"},{"jp":"うま","kana":null,"en":"Horse","short":"horses"}],"food":[{"jp":"おにぎり","kana":null,"en":"Rice ball (onigiri)","accept":["onigiri","rice ball","riceball"],"short":"rice balls"},{"jp":"すし","kana":null,"en":"Sushi","short":"sushi"},{"jp":"らーめん","kana":null,"en":"Ramen","accept":["noodles","ramen noodles"],"short":"ramen"}]},"poolNotes":{"greetings":"Some phrases come in a casual and a polite form — おはよう and おはようございます, ありがとう and ありがとうございます, よろしく and よろしくおねがいします. The longer one is the more polite. Others come in pairs: いってきます is answered by いってらっしゃい, and ただいま by おかえりなさい.","names":"Japanese says the surname first, then the first name: たなか ゆき (Yuki Tanaka). Write names in hiragana for now.","likes":"The kanji 好 means “like”: 好き is “like” and 大好き is “love”. Put 好きな in front of a noun to say “favourite” — 好きな たべもの is your favourite food. The words for colours, animals and food are in their own lists.","colours":"Lots of colour words end in いろ (“colour”): ちゃいろ, きんいろ, ぎんいろ, みずいろ, きいろ. Foreign colour words like おれんじ and ぴんく are written in hiragana for now.","animals":"Foreign words like ぺっと are written in hiragana for now — you will meet them in katakana later.","food":"These foods are written exactly as they appear — らーめん keeps its long-vowel mark ー even in hiragana.","numbers10":"Activity: make up a mnemonic story to help you remember how to count from 1 to 10 in Japanese. Type your story in the box on each card. Watch for the numbers that have more than one reading!","numbers99":"Build any number from 11 to 99 by saying the tens digit, then **じゅう**, then the ones digit — three parts in a row. The 20s, 30s and 40s all follow the same pattern.","ages":"The kanji 才 is read **SAI**. When you become as old as Mrs Cannon you **SAI** about your age! Watch out for the sound changes: 一才, 八才 and 十才 all squash together, and 二十才 is はたち.","phone":"Say a phone number one digit at a time: 0 is **ぜろ** (or れい), 4 is よん, 7 is なな and 9 is きゅう. In the sentence, **の** joins the first group of digits to the rest — like the dash in a written phone number.","adjectives":"Put a describing word after the family member and は: ははは やさしいです。 To ask, use **どんな人** — and remember 人 is read **ひと** here, not にん!","family":"Activity: make up a mnemonic story for each family member. Type your story in the box on each card — two clues are already done for you.","people":"The kanji 人 is read **NIN**. We use it to count how many “ninnies” (people) there are in your family! 一人 and 二人 are special readings, and 四人 is よにん.","places":"Put the country first, join it to the place with **の**, then add **に** and **住んでいます**. Foreign place names are written in hiragana for now."},"mnemonicInputPools":["numbers10","family"],"grammarGroups":[{"key":"greetings","title":"Greetings, Goodbyes & Other Phrases","kind":"scenarios","roleLabels":{},"tokens":[],"whyPrompt":"","scenarios":[{"answer":"はじめまして","caption":"You land in Japan and meet your host mum at the airport for the very first time. What is the first thing you say?","scene":{"setting":"airport","time":"day","l":"me","r":"hostmum","speaker":"l","props":["🧳"]}},{"answer":"はじめまして","caption":"A new student has just joined your class. You have never met her before. What do you say first?","scene":{"setting":"classroom","time":"day","l":"me","r":"classmate","speaker":"l","props":[]}},{"answer":"はじめまして","caption":"At a party, a friend introduces you to someone you have never met. What do you say first?","scene":{"setting":"party","time":"evening","l":"me","r":"stranger","speaker":"l","props":["🎈"]}},{"answer":"はじめまして","caption":"You meet your new Japanese teacher for the very first time. What do you say first?","scene":{"setting":"school","time":"day","l":"me","r":"teacher","speaker":"l","props":[]}},{"answer":"はじめまして","caption":"You visit your pen pal's home and meet her grandmother for the very first time. What do you say first?","scene":{"setting":"home","time":"day","l":"me","r":"grandma","speaker":"l","props":[]}},{"answer":"よろしく","caption":"You have just told a new classmate your name. How do you finish your introduction in a casual, friendly way?","scene":{"setting":"classroom","time":"day","l":"me","r":"classmate","speaker":"l","props":[]}},{"answer":"よろしく","caption":"Your friend introduces you to her cousin, who is your age. You say your name. What casual phrase do you add?","scene":{"setting":"park","time":"day","l":"me","r":"friend","speaker":"l","props":[]}},{"answer":"よろしく","caption":"You join the netball team and tell a teammate your own age your name. What casual phrase do you add?","scene":{"setting":"school","time":"day","l":"me","r":"classmate","speaker":"l","props":[]}},{"answer":"よろしく","caption":"Your host sister (your age) has told you her name and you have told her yours. What casual phrase do you add?","scene":{"setting":"home","time":"evening","l":"me","r":"hostsis","speaker":"l","props":[]}},{"answer":"よろしく","caption":"At a café, your friend introduces you to a new friend of hers. You say your name. What casual phrase do you add?","scene":{"setting":"cafe","time":"day","l":"me","r":"friend","speaker":"l","props":["☕"]}},{"answer":"いってきます","caption":"It is 7:45am and you are leaving home for school. What do you say to Mum as you head out the door?","scene":{"setting":"genkan","time":"morning","l":"me","r":"mum","speaker":"l","props":[]}},{"answer":"いってきます","caption":"You are heading out to your sports match. What do you say to Dad at the front door?","scene":{"setting":"genkan","time":"morning","l":"me","r":"dad","speaker":"l","props":["⚽"]}},{"answer":"いってきます","caption":"You are leaving your host family's house to go shopping. What do you say as you head out?","scene":{"setting":"genkan","time":"day","l":"me","r":"hostmum","speaker":"l","props":["🛍️"]}},{"answer":"いってきます","caption":"You are going to the park to meet friends, and Grandma is standing in the doorway. What do you say as you leave?","scene":{"setting":"genkan","time":"day","l":"me","r":"grandma","speaker":"l","props":[]}},{"answer":"いってきます","caption":"You are going out to a friend's birthday dinner and will be back later tonight. What do you say to Mum as you leave?","scene":{"setting":"genkan","time":"evening","l":"me","r":"mum","speaker":"l","props":[]}},{"answer":"いってらっしゃい","caption":"Mum is leaving for work and you are staying home. What do you say to her as she goes out the door?","scene":{"setting":"genkan","time":"morning","l":"me","r":"mum","speaker":"l","props":["💼"]}},{"answer":"いってらっしゃい","caption":"Dad is rushing out the door to catch the train. What do you say to him as he goes?","scene":{"setting":"genkan","time":"morning","l":"me","r":"dad","speaker":"l","props":["🚆"]}},{"answer":"いってらっしゃい","caption":"You call out いってきます as you leave for school. What does your host mum say back?","scene":{"setting":"genkan","time":"morning","l":"me","r":"hostmum","speaker":"r","props":[]},"q":"What does your host mum say?"},{"answer":"いってらっしゃい","caption":"Grandma is heading out to do the shopping. What do you say to her as she leaves?","scene":{"setting":"genkan","time":"day","l":"me","r":"grandma","speaker":"l","props":["🛍️"]}},{"answer":"いってらっしゃい","caption":"You call out いってきます as you leave for club practice. What does Dad say back?","scene":{"setting":"genkan","time":"day","l":"me","r":"dad","speaker":"r","props":[]},"q":"What does Dad say?"},{"answer":"ただいま","caption":"You arrive home from school at 4pm and open the front door. What do you call out as you come in?","scene":{"setting":"genkan","time":"evening","l":"me","r":"mum","speaker":"l","props":[]}},{"answer":"ただいま","caption":"You get home after netball practice and Dad is in the lounge. What do you call out as you come in?","scene":{"setting":"genkan","time":"evening","l":"me","r":"dad","speaker":"l","props":[]}},{"answer":"ただいま","caption":"After a long day out, you walk into your host family's house. What do you say as you come in?","scene":{"setting":"genkan","time":"evening","l":"me","r":"hostmum","speaker":"l","props":[]}},{"answer":"ただいま","caption":"You come back from the shops and Grandma is inside. What do you say as you come in the door?","scene":{"setting":"genkan","time":"day","l":"me","r":"grandma","speaker":"l","props":["🛍️"]}},{"answer":"ただいま","caption":"You are back from a weekend school camp and walk through your front door. What do you call out?","scene":{"setting":"genkan","time":"night","l":"me","r":"mum","speaker":"l","props":["🎒"]}},{"answer":"おかえりなさい","caption":"Your host sister walks in the door and says ただいま. What do you say to welcome her home?","scene":{"setting":"genkan","time":"evening","l":"me","r":"hostsis","speaker":"l","props":[]}},{"answer":"おかえりなさい","caption":"Dad comes home from work and calls out ただいま. What do you say to him?","scene":{"setting":"genkan","time":"evening","l":"me","r":"dad","speaker":"l","props":["💼"]}},{"answer":"おかえりなさい","caption":"Your older brother comes home from soccer and says ただいま. What do you say to him?","scene":{"setting":"genkan","time":"evening","l":"me","r":"brother","speaker":"l","props":["⚽"]}},{"answer":"おかえりなさい","caption":"Grandma comes home from the shops and says ただいま. What do you say to her?","scene":{"setting":"genkan","time":"day","l":"me","r":"grandma","speaker":"l","props":["🛍️"]}},{"answer":"おかえりなさい","caption":"Mum arrives home late from a trip and says ただいま. What do you say to welcome her?","scene":{"setting":"genkan","time":"night","l":"me","r":"mum","speaker":"l","props":["🧳"]}},{"answer":"よろしくおねがいします","caption":"You have just told your new Japanese teacher your name. How do you finish your introduction politely?","scene":{"setting":"school","time":"day","l":"me","r":"teacher","speaker":"l","props":[]}},{"answer":"よろしくおねがいします","caption":"You arrive at your homestay and tell your host mum your name. How do you finish politely?","scene":{"setting":"home","time":"evening","l":"me","r":"hostmum","speaker":"l","props":[]}},{"answer":"よろしくおねがいします","caption":"You join the school choir and tell the conductor (an adult) your name. How do you finish politely?","scene":{"setting":"classroom","time":"day","l":"me","r":"teacher","speaker":"l","props":["🎵"]}},{"answer":"よろしくおねがいします","caption":"You tell your pen pal's grandmother your name. How do you finish politely?","scene":{"setting":"home","time":"day","l":"me","r":"grandma","speaker":"l","props":[]}},{"answer":"よろしくおねがいします","caption":"You introduce yourself to the principal of the school you are visiting. How do you end politely?","scene":{"setting":"school","time":"morning","l":"me","r":"teacher","speaker":"l","props":[]}},{"answer":"おはよう","caption":"It is 7:30am and you meet your best friend at the bus stop. What do you say?","scene":{"setting":"street","time":"morning","l":"me","r":"friend","speaker":"l","props":["🚌"]}},{"answer":"おはよう","caption":"You walk into the kitchen and Mum is making breakfast. What do you say to her?","scene":{"setting":"home","time":"morning","l":"me","r":"mum","speaker":"l","props":["🍳"]}},{"answer":"おはよう","caption":"You see a classmate at the lockers before school. What do you say?","scene":{"setting":"school","time":"morning","l":"me","r":"classmate","speaker":"l","props":[]}},{"answer":"おはよう","caption":"Dad is reading the newspaper at the breakfast table. What do you say to him?","scene":{"setting":"home","time":"morning","l":"me","r":"dad","speaker":"l","props":["📰"]}},{"answer":"おはよう","caption":"You bump into your friend as you both walk to school at 8am. What do you say?","scene":{"setting":"street","time":"morning","l":"me","r":"friend","speaker":"l","props":[]}},{"answer":"おはようございます","caption":"It is 8:15am and you walk through the school gate. Your teacher is standing there. What do you say?","scene":{"setting":"school","time":"morning","l":"me","r":"teacher","speaker":"l","props":[]}},{"answer":"おはようございます","caption":"You pass your neighbour on the way to school at 7:30am. What do you say to her?","scene":{"setting":"street","time":"morning","l":"me","r":"neighbour","speaker":"l","props":[]}},{"answer":"おはようございます","caption":"You walk past the principal in the corridor at 8am. What do you say?","scene":{"setting":"school","time":"morning","l":"me","r":"teacher","speaker":"l","props":[]}},{"answer":"おはようございます","caption":"It is morning at your homestay and your host mum is in the kitchen. What do you say politely?","scene":{"setting":"home","time":"morning","l":"me","r":"hostmum","speaker":"l","props":["🍳"]}},{"answer":"おはようございます","caption":"You walk into the bakery at 8am. The shopkeeper smiles at you. What do you say?","scene":{"setting":"shop","time":"morning","l":"me","r":"shopkeeper","speaker":"l","props":["🥐"]}},{"answer":"こんにちは","caption":"It is 1pm and you meet your neighbour on the street. What do you say?","scene":{"setting":"street","time":"day","l":"me","r":"neighbour","speaker":"l","props":[]}},{"answer":"こんにちは","caption":"You walk into a shop at lunchtime. What do you say to the shopkeeper?","scene":{"setting":"shop","time":"day","l":"me","r":"shopkeeper","speaker":"l","props":[]}},{"answer":"こんにちは","caption":"You pass your teacher in the corridor at 2pm. What do you say?","scene":{"setting":"school","time":"day","l":"me","r":"teacher","speaker":"l","props":[]}},{"answer":"こんにちは","caption":"At the park, you meet your friend's grandmother in the afternoon. What do you say?","scene":{"setting":"park","time":"day","l":"me","r":"grandma","speaker":"l","props":[]}},{"answer":"こんにちは","caption":"A tourist smiles and says hello to you at 3pm. What do you say back?","scene":{"setting":"street","time":"day","l":"me","r":"stranger","speaker":"l","props":[]}},{"answer":"やっほ！","caption":"You see your close friend waiting at the park. What casual greeting do you call out?","scene":{"setting":"park","time":"day","l":"me","r":"friend","speaker":"l","props":[]},"alt":["こんにちは"]},{"answer":"やっほ！","caption":"You spot your best friend across the café. What casual greeting do you call out?","scene":{"setting":"cafe","time":"day","l":"me","r":"friend","speaker":"l","props":["☕"]},"alt":["こんにちは"]},{"answer":"やっほ！","caption":"You meet your friend at the station in the afternoon, ready to go to the movies. What casual greeting do you call out?","scene":{"setting":"station","time":"day","l":"me","r":"friend","speaker":"l","props":["🎬"]},"alt":["こんにちは"]},{"answer":"やっほ！","caption":"It is lunchtime and your friend waves to you from across the oval. What do you shout?","scene":{"setting":"school","time":"day","l":"me","r":"classmate","speaker":"l","props":[]},"alt":["こんにちは"]},{"answer":"やっほ！","caption":"A good friend arrives at your door for a visit. What casual greeting do you say as you open it?","scene":{"setting":"home","time":"day","l":"me","r":"friend","speaker":"l","props":[]},"alt":["こんにちは"]},{"answer":"またね","caption":"You and your friend have spent the afternoon together. You will see each other again some time soon, but nothing is planned. What do you say as you part?","scene":{"setting":"station","time":"evening","l":"me","r":"friend","speaker":"l","props":[]}},{"answer":"またね","caption":"The party is over and you are saying goodbye to a friend. You have not arranged to meet again. What do you say?","scene":{"setting":"party","time":"evening","l":"me","r":"friend","speaker":"l","props":["🎈"]}},{"answer":"またね","caption":"After the movies, you and your friend head off in different directions. You will catch up again some time. What do you say?","scene":{"setting":"street","time":"evening","l":"me","r":"friend","speaker":"l","props":["🎬"]}},{"answer":"またね","caption":"You finish coffee with a friend and leave the café. You will catch up again sometime. What do you say?","scene":{"setting":"cafe","time":"day","l":"me","r":"friend","speaker":"l","props":["☕"]}},{"answer":"またね","caption":"You finish a video call with your friend. You will talk again soon, but there is no set time. What do you say?","scene":{"setting":"home","time":"night","l":"me","r":"friend","speaker":"l","props":["📱"]}},{"answer":"またあした","caption":"School has finished. You know you will see your friend at school tomorrow. What do you say?","scene":{"setting":"school","time":"evening","l":"me","r":"friend","speaker":"l","props":[]},"alt":["またね"]},{"answer":"またあした","caption":"Netball practice is over, and the team practises again tomorrow. What do you say to your teammate?","scene":{"setting":"school","time":"evening","l":"me","r":"classmate","speaker":"l","props":[]},"alt":["またね"]},{"answer":"またあした","caption":"Your friend is catching her train home. You will both be at school tomorrow. What do you say?","scene":{"setting":"station","time":"evening","l":"me","r":"friend","speaker":"l","props":["🚆"]},"alt":["またね"]},{"answer":"またあした","caption":"Your friend is leaving your house after studying together. You will see her at school tomorrow. What do you say?","scene":{"setting":"home","time":"evening","l":"me","r":"friend","speaker":"l","props":["📚"]},"alt":["またね"]},{"answer":"またあ // Simple hiragana -> romaji converter (covers the kana used in this unit)
const ROMAJI_MAP = {
  "あ":"a","い":"i","う":"u","え":"e","お":"o","か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
  "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go","さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
  "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo","た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
  "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do","な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
  "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho","ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
  "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po","ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",
  "や":"ya","ゆ":"yu","よ":"yo","ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","を":"wo","ん":"n",
  "ー":"-","、":",","。":".","っ":"", // handled specially
  "きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho","ちゃ":"cha","ちゅ":"chu","ちょ":"cho",
  "にゃ":"nya","にゅ":"nyu","にょ":"nyo","ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo","みゃ":"mya","みゅ":"myu","みょ":"myo",
  "りゃ":"rya","りゅ":"ryu","りょ":"ryo","ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo","じゃ":"ja","じゅ":"ju","じょ":"jo",
  "びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo",
};

Object.assign(ROMAJI_MAP, {
  "てぃ":"ti","でぃ":"di","とぅ":"tu","どぅ":"du","ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo",
  "うぃ":"wi","うぇ":"we","うぉ":"wo","しぇ":"she","じぇ":"je","ちぇ":"che",
  "でゅ":"dyu","てゅ":"tyu","ふゅ":"fyu",
});
const SMALL_KANA = "ゃゅょぁぃぅぇぉ";
// Katakana -> hiragana (the long-vowel mark ー is left alone) so katakana words convert too.
function toHiragana(s) {
  return Array.from(s || "").map((c) => { const cp = c.codePointAt(0); return (cp >= 0x30A1 && cp <= 0x30F6) ? String.fromCodePoint(cp - 0x60) : c; }).join("");
}
function kanaToRomaji(input) {
  if (!input) return "";
  const chars = Array.from(toHiragana(input).replace(/[・！!？?]/g, ""));
  let out = "";
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    const next = chars[i + 1];
    if (c === "っ" && next) {
      const nextRomaji = ROMAJI_MAP[chars[i + 1] + (chars[i + 2] || "")] || ROMAJI_MAP[next] || "";
      out += nextRomaji.charAt(0);
      continue;
    }
    const twoChar = c + (next || "");
    if (next && ROMAJI_MAP[twoChar] && SMALL_KANA.includes(next)) {
      out += ROMAJI_MAP[twoChar];
      i++;
      continue;
    }
    out += ROMAJI_MAP[c] !== undefined ? ROMAJI_MAP[c] : c;
  }
  return out;
}
// Display form: long-vowel mark becomes a doubled vowel (しどにー -> shidonii).
function romajiDisplay(kana) { return kanaToRomaji(kana).replace(/([aiueo])-/g, "$1$1"); }
function normRomaji(s) { return (s || "").toLowerCase().replace(/[\s'’\-・.]/g, ""); }
// All accepted typed spellings: long vowels may be doubled or collapsed (chuugoku / chugoku, toukyou / tokyo).
function romajiForms(kana) {
  const base = kanaToRomaji(kana);
  const set = new Set();
  [base, base.replace(/-/g, ""), base.replace(/([aiueo])-/g, "$1$1")].forEach((f) => {
    set.add(normRomaji(f));
    set.add(normRomaji(f.replace(/ou/g, "o").replace(/oo/g, "o").replace(/uu/g, "u")));
  });
  return set;
}
function romajiMatches(value, kana, alts) {
  const val = normRomaji(value);
  if (!val) return false;
  return [kana].concat(alts || []).some((k) => romajiForms(k).has(val));
}
function stripJp(s) { return (s || "").replace(/[\s\u3000・！!？?。、]/g, "").toLowerCase(); }
// "Type Japanese or romaji": accepts the kanji/main form, the kana reading, any other reading, or romaji.
function jpAnswerMatches(value, v) {
  const val = stripJp(value);
  if (!val) return false;
  const forms = [v.jp, v.kana].concat(v.alts || []).filter(Boolean).map(stripJp);
  if (forms.includes(val)) return true;
  return romajiMatches(value, v.kana || v.jp, v.alts);
}
function mdBold(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/\*\*(.+?)\*\*/g, "<b>$1</b>"); }

// Mora splitter — small kana (ゃゅょ) attach to the preceding character, matching the booklet's tracing grids.
function splitMorae(reading) {
  const smalls = new Set(["ゃ", "ゅ", "ょ", "ぁ", "ぃ", "ぅ", "ぇ", "ぉ", "ャ", "ュ", "ョ", "ァ", "ィ", "ゥ", "ェ", "ォ"]);
  const chars = Array.from(reading || "").filter((ch) => ch !== "・" && ch.trim() !== "");
  const morae = [];
  for (const ch of chars) {
    if (smalls.has(ch) && morae.length > 0) morae[morae.length - 1] += ch;
    else morae.push(ch);
  }
  return morae;
}

function shuffle(a) { return shuffleArr(a); }

// Some vocab items list more than one valid English meaning (e.g. "Clubs / Activities",
// "Break / Morning Tea"). Typing any single one of them counts as correct everywhere we check English answers.
function matchesAnyMeaning(input, v) {
  // v is a vocab item (or a plain English string). Some items list more than one valid English meaning
  // ("One (1)", "Mum" / "Mother"): typing any one of them, or any listed `accept` form, counts as correct.
  const val = (input || "").trim().toLowerCase().replace(/\s+/g, " ");
  if (!val) return false;
  const raw = typeof v === "string" ? v : v.en;
  const forms = new Set();
  const add = (s) => { s = (s || "").trim().toLowerCase().replace(/\s+/g, " "); if (s) forms.add(s); };
  add(raw); // the whole meaning exactly as shown on the card also counts
  raw.split("/").forEach((part) => {
    add(part);
    add(part.replace(/\([^)]*\)/g, ""));
    const m = part.match(/\((\d+)\)/);
    if (m) add(m[1]);
  });
  if (typeof v !== "string" && v.accept) v.accept.forEach(add);
  return forms.has(val);
}

// The word lists in topic rows (DATA.vocabRows); any list not named in a row goes in a last row.
function vocabRowKeys() {
  const placed = new Set();
  const rows = [];
  (DATA.vocabRows || []).forEach((keys) => {
    const present = keys.filter((k) => DATA.vocabPools[k]);
    present.forEach((k) => placed.add(k));
    if (present.length) rows.push(present);
  });
  const rest = Object.keys(DATA.vocabPools).filter((k) => !placed.has(k));
  if (rest.length) rows.push(rest);
  return rows;
}

function traceCard(v, poolKey) {
  const word = v.jp;
  const reading = (v.kana || v.jp).replace(/[・！!？?]/g, ""); // kana reading — used for TTS and tracing (no dots or marks)
  const morae = splitMorae(reading);
  const card = el("div", { class: "card" });
  const top = el("div", { style: "display:flex;justify-content:space-between;align-items:center;" });
  top.appendChild(el("span", {
    class: "jp jp-word", "data-tooltip": v.en, style: "font-size:1.5rem;font-weight:700;color:var(--navy);",
    text: word, onclick: () => speak(reading),
  }));
  top.appendChild(el("button", { class: "btn secondary", style: "padding:6px 12px;", text: "🔊", onclick: () => speak(reading) }));
  card.appendChild(top);
  if (v.kana) card.appendChild(el("div", { class: "jp small", style: "margin:4px 0;color:var(--text-sec);", text: v.kana }));
  card.appendChild(el("div", { class: "small", style: "margin-bottom:2px;letter-spacing:.08em;font-weight:700;color:var(--text-sec);", text: romajiDisplay(reading).toUpperCase() }));
  if (v.alts && v.alts.length) {
    const alt = el("div", { class: "small", style: "margin:2px 0 4px;" }, [document.createTextNode((v.altLabel || "Other readings") + ": ")]);
    v.alts.forEach((a, i) => {
      if (i) alt.appendChild(document.createTextNode("・"));
      alt.appendChild(el("span", { class: "jp jp-word", style: "font-weight:700;color:var(--navy);", text: a, onclick: () => speak(a) }));
    });
    card.appendChild(alt);
  }
  card.appendChild(el("div", { class: "small", style: "margin-bottom:8px;", text: "Meaning: " + v.en }));
  if (v.note) card.appendChild(el("div", { class: "small", style: "margin:-2px 0 8px;color:var(--text-sec);", text: "ℹ️ " + v.note }));
  if (v.mnemonic) card.appendChild(el("div", { class: "small", style: "margin:0 0 8px;padding:8px 10px;background:var(--pink-light);border-radius:8px;color:var(--navy);", html: "💡 " + mdBold(v.mnemonic) }));
  if (DATA.mnemonicInputPools && DATA.mnemonicInputPools.includes(poolKey)) {
    card.appendChild(el("input", { type: "text", placeholder: "💡 Write your own mnemonic story…", style: "width:100%;margin:0 0 10px;font-size:.82rem;" }));
  }
  const row = el("div", { class: "mora-row" });
  card.appendChild(row);
  const clearBtn = el("button", { class: "btn secondary", style: "margin-top:8px;padding:6px 14px;font-size:.7rem;", text: "Clear" });
  card.appendChild(clearBtn);
  const clearFns = [];
  morae.forEach((mora) => {
    const canvas = el("canvas", { class: "mora-box", width: "170", height: "170" });
    row.appendChild(canvas);
    setTimeout(() => {
      const ctx = canvas.getContext("2d");
      function drawGuide() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#eef1f6"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(canvas.width / 2, 4); ctx.lineTo(canvas.width / 2, canvas.height - 4);
        ctx.moveTo(4, canvas.height / 2); ctx.lineTo(canvas.width - 4, canvas.height / 2); ctx.stroke();
        ctx.font = "88px 'Noto Sans JP'"; ctx.fillStyle = "rgba(4,30,66,0.18)";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(mora, canvas.width / 2, canvas.height / 2 + 2);
      }
      drawGuide();
      clearFns.push(drawGuide);
      let drawing = false, last = null;
      function pos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }; }
      canvas.addEventListener("pointerdown", (e) => { drawing = true; last = pos(e); });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = pos(e);
        ctx.strokeStyle = "#041E42"; ctx.lineWidth = 6; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
      });
      window.addEventListener("pointerup", () => (drawing = false));
    }, 0);
  });
  clearBtn.onclick = () => clearFns.forEach((f) => f());
  return card;
}

function renderGrammarLanding(app) {
  app.appendChild(el("h2", { class: "section-title", text: "Grammar Mode" }));
  app.appendChild(el("p", { class: "section-desc", text: "Choose a language pattern to practise." }));
  // Topics sit in the rows set by DATA.grammarRows (a topic with no content yet is simply skipped).
  const placed = new Set();
  const addRow = (idxs) => {
    const grid = el("div", { class: "grid cols-3", style: "margin-bottom:14px;" });
    idxs.forEach((i) => {
      placed.add(i);
      const g = DATA.grammarGroups[i];
      const card = el("div", { class: "menu-card", onclick: () => { grammarIdx = i; grammarSubTab = "explain"; view = "grammar-content"; renderApp(); } });
      card.appendChild(el("div", { class: "icon", text: "🧩" }));
      card.appendChild(el("h3", { text: g.title }));
      card.appendChild(el("p", { text: g.kind === "scenarios" ? "Look at the picture, read the situation and choose the right phrase" : "Explanation, cloze, arrange, drills & free writing" }));
      grid.appendChild(card);
    });
    app.appendChild(grid);
  };
  (DATA.grammarRows || []).forEach((keys) => {
    const idxs = keys.map((k) => DATA.grammarGroups.findIndex((g) => g.key === k)).filter((i) => i >= 0);
    if (idxs.length) addRow(idxs);
  });
  const rest = DATA.grammarGroups.map((_, i) => i).filter((i) => !placed.has(i));
  if (rest.length) addRow(rest);
}

const ROLE_LABEL = { subject: "subject", timeGeneral: "time (general)", timeSpecific: "time (specific)", manner: "manner", place: "place", object: "object", adjective: "adjective", verbStem: "verb stem", verbEnding: "verb/element ending", particle: "particle" };
function legendRow(group) {
  // Shows only the colour roles used by this pattern; a pattern may relabel a role (e.g. "tens digit").
  const l = el("div", { class: "legend" });
  const used = new Set();
  group.tokens.forEach((we) => we.tokens.forEach((t) => { if (t.r) used.add(t.r); }));
  const labels = Object.assign({}, ROLE_LABEL, group.roleLabels || {});
  Object.keys(ROLE_LABEL).forEach((k) => { if (used.has(k)) l.appendChild(el("span", { class: "role-" + k, text: labels[k] })); });
  return l;
}

// Word-level hover glossary: vocabulary words (from the pools) plus common particles/predicate pieces.
const PARTICLE_GLOSSARY = {
  "は": "topic marker — ‘as for...’ (said “wa”)",
  "の": "‘of’ — links the bigger place to the smaller place inside it (日本の とうきょう = Tokyo in Japan)",
  "と": "and (links the members of a list)",
  "に": "‘in / at’ — marks the place where you live",
  "か": "question marker (like a spoken ‘?’)",
  "か。": "question marker (like a spoken ‘?’)",
  "です": "is / am / are",
  "です。": "is / am / are",
  "何": "what / how many",
  "人": "person (counter for people, read NIN)",
  "住んで": "live (verb stem)",
  "います": "polite ‘am / are’ ending",
  "います。": "polite ‘am / are’ ending",
  "わたし": "I / me",
  "かぞえましょう": "Let's count!",
  "かぞえましょう！": "Let's count!",
  "はい": "yes",
  "が": "marks the thing you like or dislike — the spotlight of the sentence",
  "そうですか": "I see / really?",
  "そうですか。": "I see / really?",
  "、": "pause (comma)"
};
let WORD_GLOSSARY = null;
function getWordGlossary() {
  if (WORD_GLOSSARY) return WORD_GLOSSARY;
  WORD_GLOSSARY = { ...PARTICLE_GLOSSARY };
  Object.values(DATA.vocabPools).forEach((pool) => pool.forEach((v) => { WORD_GLOSSARY[v.jp] = v.en; }));
  return WORD_GLOSSARY;
}
function glossFor(text) {
  const glossary = getWordGlossary();
  if (glossary[text] !== undefined) return glossary[text];
  const stripped = text.replace(/[。、]/g, "");
  return glossary[stripped];
}

function tokenLine(tokens) {
  const p = el("p", { class: "jp", style: "font-size:1.3rem;margin:6px 0;flex:1;" });
  tokens.forEach((t) => {
    const gloss = t.g || glossFor(t.t);
    const span = el("span", { class: t.r ? "token role-" + t.r : "token", text: t.t });
    if (gloss) span.setAttribute("data-tooltip", gloss);
    span.style.cursor = "pointer";
    span.addEventListener("click", (e) => { e.stopPropagation(); speak(t.s || t.t); });
    p.appendChild(span);
  });
  return p;
}
const GRAMMAR_EXPLANATIONS = {
  "numbers10": "How it's made: every number has one kanji and one main reading — use the main reading when you are simply counting. Five numbers (4, 7, 8, 9 and 10) have a second reading that shows up when the number joins with a counter such as 人 or 才, so watch for them as the unit goes on.",
  "numbers99": "How it's made: say the tens digit, then じゅう, then the ones digit — three parts in a row. 十 on its own means 10, so the teens (11–19) skip the tens digit (十三 = じゅうさん). From 20 up the tens digit comes first (二十 = にじゅう, 三十五 = さんじゅうご). A multiple of ten has no ones digit.",
  "age": "How it's made: start with the subject (わたし) and は, then the number, then the counter 才 (さい, “years old”), and finish with です. To ask, swap the number for 何 (何才ですか) or use おいくつ, the more polite and conversational way to ask. Careful — some numbers change sound before 才: 一才 = いっさい, 八才 = はっさい, 十才 = じゅっさい, and 二十才 is はたち.",
  "family": "How it's made: to ask who is in your family, だれ (“who”) goes in the family member slot. To answer, drop か and replace だれ with your family members — join them with と (“and”). The last member goes straight into です, with no と after it.",
  "people": "How it's made: to ask how many people are in your family, use 何人 (なんにん, “how many people”). You can say かぞくは何人ですか or switch the order — 何人かぞくですか — the answer is the same. To answer, drop か and replace 何 with a number — the counter 人 stays. 一人 (ひとり) and 二人 (ふたり) are special readings, and 四人 is よにん (not よんにん).",
  "phone": "How it's made: to ask, put 何 (“what”) in front of です: でんわばんごうは何ですか。 To answer, replace 何 with your number and drop か. Say the number one digit at a time (0 is ぜろ, 4 is よん, 7 is なな, 9 is きゅう). の joins the first group of four digits to the rest, like the dash in a written phone number, then you say the two groups of three.",
  "greetings": "How it's made: you pick a phrase by thinking about the situation — who you are talking to, what time of day it is, and whether someone is coming or going. Casual forms (おはよう, ありがとう, よろしく) are for friends and family; the longer polite forms (おはようございます, ありがとうございます, よろしくおねがいします) are for teachers, shopkeepers and other adults. Some phrases come in pairs: いってきます (leaving home) is answered by いってらっしゃい, and ただいま (arriving home) is answered by おかえりなさい.",
  "name": "How it's made: to ask someone's name, use おなまえは 何ですか — the お makes it polite, so use it for other people's names and never your own. You can shorten it to おなまえは？ or make a polite request: おなまえ おねがいします。 To answer, say your surname first, then your first name, then です — or といいます (“I am called…”). Japanese puts the surname first, the opposite of English.",
  "likes": "How it's made: to ask what someone likes, use 何が 好きですか。 To ask about a favourite in one category, put 好きな in front of the category word (たべもの, どうぶつ or いろ), then は 何ですか: 好きな たべものは 何ですか。 To answer, name the thing and mark it with が, then say 好きです (like) or 大好きです (love): すしが 好きです。 Any colour, animal or food from your word lists fits in the thing slot.",
  "describe": "How it's made: to ask about a family member, use (family member)は どんな人ですか (“what kind of person is ...?”). To answer, drop どんな人 and か, and put a describing word in its place: (family member)は (describing word)です。 Careful — 人 is read ひと here, but にん when you are counting people!",
  "live": "How it's made: to ask, put どこ (“where”) before に and 住んでいますか. To answer, replace どこ with the place and drop か. To add a bigger place (a country or a city), put it first and join it to the smaller place with の — Japanese goes from big to small (日本の とうきょう), while English does the opposite (“Tokyo, Japan”). Treat 住んでいます as one chunk when you say it."
};
function renderExplain(body, group) {
  const weKey = group.key.replace(/2$/, "");
  body.appendChild(legendRow(group));
  body.appendChild(el("p", { class: "small", style: "margin:-8px 0 10px;", text: "Click the 🔊 button to hear the whole sentence, or click any individual word to hear just that word. Hover for meanings." }));
  const howCard = el("div", { class: "card", style: "margin-bottom:16px;background:var(--navy-tint);" });
  howCard.appendChild(el("div", { class: "small", style: "font-weight:700;color:var(--navy);", text: GRAMMAR_EXPLANATIONS[weKey] || "" }));
  body.appendChild(howCard);
  group.tokens.forEach((we) => {
    const card = el("div", { class: "card", style: "margin-bottom:14px;" });
    const headRow = el("div", { style: "display:flex;justify-content:space-between;align-items:flex-start;gap:10px;" });
    const line = tokenLine(we.tokens);
    headRow.appendChild(line);
    headRow.appendChild(el("button", { class: "btn secondary", style: "padding:5px 12px;font-size:.8rem;flex-shrink:0;", text: "🔊", onclick: () => speak(we.say || we.tokens.map((t) => t.s || t.t).join("")) }));
    card.appendChild(headRow);
    card.appendChild(el("div", { class: "small", text: we.en }));
    body.appendChild(card);
  });
}
function renderArrange(body, group) {
  group.scrambleSet.forEach((cfg, idx) => {
    const card = el("div", { class: "card", style: "margin-bottom:14px;" });
    card.appendChild(el("div", { class: "small", style: "margin-bottom:10px;font-weight:700;", text: `${idx + 1}. Tap the tiles in order to rebuild the sentence: ` + cfg.en }));
    const answerRow = el("div", { style: "min-height:50px;border:2px dashed var(--border-light);border-radius:8px;padding:8px;margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;" });
    const bankRow = el("div", { style: "display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;" });
    let bank = shuffle(cfg.chunks);
    let answer = [];
    function redraw() {
      bankRow.innerHTML = ""; answerRow.innerHTML = "";
      bank.forEach((t, i) => {
        bankRow.appendChild(el("button", { class: "btn secondary jp", style: "padding:8px 14px;font-size:1rem;", text: t, onclick: () => { answer.push(t); bank.splice(i, 1); redraw(); } }));
      });
      answer.forEach((t, i) => {
        answerRow.appendChild(el("button", { class: "btn pink jp", style: "padding:8px 14px;font-size:1rem;", text: t, onclick: () => { bank.push(t); answer.splice(i, 1); redraw(); } }));
      });
    }
    redraw();
    card.appendChild(el("div", { class: "small", text: "Answer:" }));
    card.appendChild(answerRow);
    card.appendChild(el("div", { class: "small", text: "Tiles:" }));
    card.appendChild(bankRow);
    const result = el("div", { class: "small", style: "margin-top:10px;font-weight:700;" });
    const checkBtn = el("button", { class: "btn pink", text: "Check", onclick: () => {
      const built = answer.join("");
      const correct = cfg.chunks.join("");
      if (built === correct) { result.textContent = "✓ Correct!"; result.style.color = "var(--green)"; }
      else { result.textContent = "✗ Not quite. Correct order: " + cfg.chunks.join(" "); result.style.color = "var(--red)"; }
    } });
    const resetBtn = el("button", { class: "btn secondary", text: "Shuffle Again", onclick: () => { bank = shuffle(cfg.chunks); answer = []; redraw(); result.textContent = ""; } });
    card.appendChild(checkBtn); card.appendChild(document.createTextNode(" ")); card.appendChild(resetBtn);
    card.appendChild(result);
    body.appendChild(card);
  });
}

    card.appendChild(head);

function renderDrills(body, group) {
  [["Japanese → English", group.drillsJtoE, "jp"], ["English → Japanese", group.drillsEtoJ, "en"]].forEach(([label, list, promptKey]) => {
    body.appendChild(el("h3", { style: "color:var(--navy);font-size:1rem;margin:18px 0 8px;", text: label }));
    list.forEach((item, i) => {
      const row = el("div", { class: "card", style: "display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:12px 16px;" });
      const promptSpan = el("span", { class: promptKey === "jp" ? "jp jp-word" : "", text: `${i + 1}. ${item[promptKey]}` });

let boardStage = 0;

let boardSelections = {}; // key: `${stageIdx}:${slotId}` -> chosen vocab index

function getSlotChoice(stageIdx, slot) {
  const key = stageIdx + ":" + slot.id;
  return boardSelections[key] !== undefined ? boardSelections[key] : slot.default;
}
function setSlotChoice(stageIdx, slotId, idx) {
  boardSelections[stageIdx + ":" + slotId] = idx;
}
// Resolve a template string like "{s0}が好きですか。" using the current slot choices.
function resolveTpl(str, slotValues, speakMode) {
  // {id} = Japanese, {id_en} = English, {id_en_lower} = lower-case English, {id_short} = short English (e.g. a digit).
  // speakMode swaps in the kana reading so text-to-speech says numbers and names correctly.
  return str.replace(/\{(\w+?)(_en)?(_lower)?(_short)?\}/g, (match, id, enFlag, lowerFlag, shortFlag) => {
    const v = slotValues[id];
    if (!v) return match;
    let out;
    if (enFlag) out = v.en;
    else if (shortFlag) out = v.short || v.en;
    else out = speakMode ? (v.kana || v.jp) : v.jp;
    if (lowerFlag) out = out.toLowerCase();
    return out;
  }).replace(/\|/g, "");
}

let matchPool = "numbers10";
let matchState = null;
let matchBest = null;
const MATCH_MAX_PAIRS = 20; // very long lists (e.g. 27 suburbs) use a random 20 per game
function renderMatching(app) {
  app.appendChild(el("h2", { class: "section-title", text: "Timed Matching" }));
  app.appendChild(el("p", { class: "section-desc", text: "Drag each Japanese tile onto its matching English tile as fast as you can." }));
  const poolNav = el("div", { class: "pool-select" });
  Object.keys(DATA.vocabPools).forEach((k) => {
    poolNav.appendChild(el("button", { class: "pool-btn" + (k === matchPool ? " active" : ""), text: POOL_LABELS[k], onclick: () => { matchPool = k; matchState = null; matchBest = null; renderApp(); } }));
  });
  app.appendChild(poolNav);

  if (!matchState) {
    const card = el("div", { class: "card", style: "max-width:520px;" }, [
      el("div", { class: "small", style: "margin-bottom:14px;", text: (DATA.vocabPools[matchPool].length > MATCH_MAX_PAIRS ? `Ready to match ${MATCH_MAX_PAIRS} random words from the ${DATA.vocabPools[matchPool].length} in ${POOL_LABELS[matchPool]}? The timer starts as soon as you begin.` : `Ready to match all ${DATA.vocabPools[matchPool].length} words in ${POOL_LABELS[matchPool]}? The timer starts as soon as you begin.`) }),
      el("button", { class: "btn pink", text: "Start Game", onclick: () => { startMatchGame(); renderApp(); } }),
    ]);
    app.appendChild(card);
    return;
  }

  const info = el("div", { class: "small", style: "margin-bottom:10px;" });
  app.appendChild(info);
  const board = el("div", { style: "position:relative;width:100%;background:var(--navy-tint);border-radius:12px;overflow:hidden;" });
  app.appendChild(board);
  const restartBtn = el("button", { class: "btn pink", style: "margin-top:12px;", text: "Shuffle Board", onclick: () => { matchState = null; renderApp(); } });
  app.appendChild(restartBtn);

  const st = matchState;
  board.style.height = st.boardHeight + "px";
  function updateInfo() {
    let timeStr = "—";
    if (st.startTime) { const end = st.endTime || Date.now(); timeStr = ((end - st.startTime) / 1000).toFixed(1) + "s"; }
    info.textContent = `Matched: ${st.matched} / ${st.total}   ·   Time: ${timeStr}   ·   Best: ${matchBest ? matchBest.toFixed(1) + "s" : "—"}`;
  }
  updateInfo();
  let ticker = setInterval(() => { if (st.startTime && !st.endTime) updateInfo(); else clearInterval(ticker); }, 200);

  st.tiles.forEach((t) => {
    if (t.done) return;
    const tileEl = el("div", {
      class: t.type === "jp" ? "card jp" : "card",
      style: `position:absolute;left:${t.x}%;top:${t.y}%;padding:8px 14px;cursor:grab;background:#fff;font-size:.85rem;white-space:nowrap;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.1);`,
      text: t.text,
    });
    tileEl.dataset.id = t.id; tileEl.dataset.type = t.type;
    board.appendChild(tileEl);
    let dragging = false, offX = 0, offY = 0;
    tileEl.addEventListener("pointerdown", (e) => {
      dragging = true; tileEl.style.cursor = "grabbing"; tileEl.style.zIndex = 10;
      if (!st.startTime) { st.startTime = Date.now(); updateInfo(); }
      const r = board.getBoundingClientRect();
      offX = e.clientX - tileEl.getBoundingClientRect().left; offY = e.clientY - tileEl.getBoundingClientRect().top;
      tileEl.setPointerCapture(e.pointerId);
    });
    tileEl.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const r = board.getBoundingClientRect();
      let nx = ((e.clientX - r.left - offX) / r.width) * 100;
      let ny = ((e.clientY - r.top - offY) / r.height) * 100;
      tileEl.style.left = nx + "%"; tileEl.style.top = ny + "%";
    });
    tileEl.addEventListener("pointerup", (e) => {
      dragging = false; tileEl.style.cursor = "grab"; tileEl.style.zIndex = 1;
      tileEl.style.pointerEvents = "none";
      const under = document.elementFromPoint(e.clientX, e.clientY);
      tileEl.style.pointerEvents = "";
      if (under && under.dataset && under.dataset.id === String(t.id) && under.dataset.type !== t.type && under !== tileEl) {
        tileEl.style.background = "#d9f5e3"; under.style.background = "#d9f5e3";
        setTimeout(() => { tileEl.remove(); under.remove(); }, 250);
        t.done = true;
        const otherTile = st.tiles.find((x) => x.id === t.id && x.type !== t.type);
        if (otherTile) otherTile.done = true;
        st.matched++;
        updateInfo();
        if (st.matched >= st.total) {
          st.endTime = Date.now();
          const secs = (st.endTime - st.startTime) / 1000;
          if (!matchBest || secs < matchBest) matchBest = secs;
          updateInfo();
        }
      } else {
        tileEl.style.transition = "left .2s, top .2s";
        tileEl.style.left = t.x + "%"; tileEl.style.top = t.y + "%";
        if (under) { under.style.background = "#fbdada"; setTimeout(() => (under.style.background = "#fff"), 300); }
        setTimeout(() => (tileEl.style.transition = ""), 200);
      }
    });
  });
}

function startMatchGame() {
  const words = shuffle(DATA.vocabPools[matchPool]).slice(0, MATCH_MAX_PAIRS); // every word, up to the cap
  const tiles = [];
  words.forEach((w, i) => {
    tiles.push({ id: i, type: "jp", text: w.jp });
    tiles.push({ id: i, type: "en", text: w.en });
  });
  const shuffledTiles = shuffle(tiles);
  // Jittered-grid layout: spreads tiles evenly (avoiding heavy overlap) while still looking scattered.
  const cols = shuffledTiles.length > 16 ? 5 : 4;
  const rows = Math.ceil(shuffledTiles.length / cols);
  const cellW = 100 / cols;
  const cellH = 100 / rows;
  shuffledTiles.forEach((t, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    t.x = col * cellW + 1 + Math.random() * Math.max(cellW - 16, 2);
    t.x = Math.min(t.x, Math.max(100 - Math.min(45, (t.text.length * 15 + 36) / 11), 0));
    t.y = row * cellH + 1 + Math.random() * Math.max(cellH - 12, 2);
  });
  const boardHeight = Math.max(420, rows * 78);
  matchState = { tiles: shuffledTiles, matched: 0, total: words.length, startTime: Date.now(), endTime: null, boardHeight };
}

const TYPHOON_DIFFICULTY = {
  easy: { label: "Easy", delayMin: 7000, delayMax: 13000, accuracy: 0.35 },
  medium: { label: "Medium", delayMin: 5000, delayMax: 9000, accuracy: 0.55 },
  hard: { label: "Hard", delayMin: 3500, delayMax: 6500, accuracy: 0.75 },
  ultra: { label: "Ultra", delayMin: 2000, delayMax: 4000, accuracy: 0.92 }, // still floored well above instant — no faster than a quick Year 6 typist
};
let typhoonState = null;
let typhoonSelectedPools = null;
let typhoonDirection = "jToE";
let typhoonMode = "pvc";
let typhoonDifficulty = "medium";

function buildHouses(numHouses) {
  const houses = [];
  for (let i = 0; i < numHouses; i++) {
    const isTyphoon = i < Math.round(numHouses * 0.15);
    houses.push({ id: i, isTyphoon, points: isTyphoon ? 0 : Math.floor(Math.random() * 16 + 5) * 10, revealed: false });
  }
  return shuffle(houses).map((h, i) => ({ ...h, id: i }));
}
function pickTyphoonWord(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
function checkTyphoonAnswer(word, direction, value) {
  const v = value.trim().toLowerCase();
  if (!v) return false;
  if (direction === "jToE") return matchesAnyMeaning(v, word);
  return jpAnswerMatches(value, word);
}

function winnerLabel(st, who) {
  if (who === "computer") return "Computer";
  if (st.mode === "pvc") return who === "P2" ? "Computer" : "You";
  return who === "P1" ? "Player 1" : "Player 2";
}

function renderTyphoonTopCard(topCard, st) {
  const word = st.currentWord;
  const prompt = st.direction === "jToE" ? word.jp : word.en;

  if (st.phase === "revealing") {
    const r = st.lastReveal;
    topCard.appendChild(el("div", { style: "font-size:1.2rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:14px;", text: r.isTyphoon ? `🌀 Typhoon! ${winnerLabel(st, r.winner)}'s score is wiped.` : `+${r.points} points for ${winnerLabel(st, r.winner)}!` }));
    topCard.appendChild(el("button", { class: "btn pink", style: "display:block;margin:0 auto;", text: "Continue →", onclick: continueAfterReveal }));
    return;
  }

  if (st.phase === "selecting-house") {
    topCard.appendChild(el("div", { class: st.direction === "jToE" ? "jp" : "", style: "font-size:1.6rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:6px;", text: prompt }));
    topCard.appendChild(el("div", { style: "text-align:center;font-weight:700;color:var(--green);", text: `✓ ${winnerLabel(st, st.pendingWinner)} got it! Select a house below.` }));
    return;
  }

  if (st.phase === "pvp-judge") {
    topCard.appendChild(el("div", { class: st.direction === "jToE" ? "jp" : "", style: "font-size:1.6rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:10px;", text: prompt }));
    topCard.appendChild(el("div", { style: "text-align:center;margin-bottom:10px;" }, [
      el("span", { class: "small", text: "Answer: " }),
      el("span", { class: word.jp && st.direction === "eToJ" ? "jp" : "", style: "font-weight:800;color:var(--pink);", text: st.direction === "jToE" ? word.en : word.jp + (word.kana ? " (" + kanaToRomaji(word.kana) + ")" : "") }),
    ]));
    const btnRow = el("div", { style: "display:flex;gap:10px;justify-content:center;flex-wrap:wrap;" });
    btnRow.appendChild(el("button", { class: "btn pink", text: "Player 1 got it ✓", onclick: () => { st.pendingWinner = "P1"; st.phase = "selecting-house"; renderApp(); } }));
    btnRow.appendChild(el("button", { class: "btn pink", text: "Player 2 got it ✓", onclick: () => { st.pendingWinner = "P2"; st.phase = "selecting-house"; renderApp(); } }));
    btnRow.appendChild(el("button", { class: "btn secondary", text: "Nobody — skip round", onclick: () => { nextTyphoonRound(st); renderApp(); } }));
    topCard.appendChild(btnRow);
    return;
  }

  // phase === "answering"
  topCard.appendChild(el("div", { class: st.direction === "jToE" ? "jp" : "", style: "font-size:1.8rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:14px;", text: prompt }));

  if (st.mode === "pvp") {
    topCard.appendChild(el("div", { class: "small", style: "text-align:center;margin-bottom:12px;", text: "Say the answer out loud — first to say it correctly wins the round!" }));
    const revealBtn = el("button", { class: "btn pink", style: "display:block;margin:0 auto;", text: "🔔 Reveal Answer", onclick: () => { st.phase = "pvp-judge"; renderApp(); } });
    topCard.appendChild(revealBtn);
    return;
  }

  // PvC: two side-by-side fields
  const row = el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:14px;" });
  const youCol = el("div", {});
  youCol.appendChild(el("div", { class: "small", style: "font-weight:700;margin-bottom:6px;", text: "Your answer" }));
  const input = el("input", { type: "text", placeholder: st.direction === "jToE" ? "Type the English meaning..." : "Type in Japanese or romaji...", style: "width:100%;", autofocus: "true" });
  if (st.pendingInputValue) { input.value = st.pendingInputValue; st.pendingInputValue = ""; }
  const feedback = el("div", { class: "small", style: "margin-top:6px;min-height:18px;" });
  youCol.appendChild(input);
  youCol.appendChild(feedback);
  row.appendChild(youCol);

  const compCol = el("div", {});
  compCol.appendChild(el("div", { class: "small", style: "font-weight:700;margin-bottom:6px;", text: "Computer" }));
  compCol.appendChild(el("div", { class: "small", id: "typhoonComputerStatus", style: "padding:8px 0;", text: st.computerStatus || "🤔 thinking..." }));
  row.appendChild(compCol);
  topCard.appendChild(row);

  function submit() {
    if (checkTyphoonAnswer(st.currentWord, st.direction, input.value)) {
      if (st.computerTimerId) { clearTimeout(st.computerTimerId); st.computerTimerId = null; }
      st.pendingWinner = "P1";
      st.phase = "selecting-house";
      renderApp();
    } else {
      feedback.textContent = "✗ Not quite — try again!";
      feedback.style.color = "var(--red)";
      input.value = "";
    }
  }
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  const submitBtn = el("button", { class: "btn pink", style: "margin-top:8px;", text: "Submit", onclick: submit });
  youCol.appendChild(submitBtn);

  // Schedule the computer's single attempt for this round, once.
  if (!st.computerTimerId) {
    const conf = TYPHOON_DIFFICULTY[st.difficulty];
    const delay = conf.delayMin + Math.random() * (conf.delayMax - conf.delayMin);
    st.computerTimerId = setTimeout(() => {
      if (typhoonState !== st || st.phase !== "answering") return; // round already resolved or game restarted
      st.computerTimerId = null;
      const correct = Math.random() < conf.accuracy;
      if (correct) {
        computerAutoPickHouse();
      } else {
        const wrongGuess = st.direction === "jToE" ? shuffle(st.wordPool.map((w) => w.en)).find((e) => e !== st.currentWord.en) : shuffle(st.wordPool.map((w) => w.jp)).find((j) => j !== st.currentWord.jp);
        st.computerStatus = "✗ guessed: " + (wrongGuess || "...");
        // Preserve whatever the student was mid-typing before we refresh the view.
        const liveInput = document.querySelector("#app input[type=text]");
        if (liveInput) st.pendingInputValue = liveInput.value;
        renderApp();
        setTimeout(() => { const li = document.querySelector("#app input[type=text]"); if (li) { li.focus(); li.setSelectionRange(li.value.length, li.value.length); } }, 0);
      }
    }, delay);
  }
}

function revealHouse(house, winner) {
  const st = typhoonState;
  house.revealed = true;
  if (house.isTyphoon) st.scores[winner] = 0;
  else st.scores[winner] = (st.scores[winner] || 0) + house.points;
  st.lastReveal = { isTyphoon: house.isTyphoon, points: house.points, winner };
  st.phase = "revealing";
  st.pendingWinner = null;
  renderApp();
}
function claimHouse(house) {
  revealHouse(house, typhoonState.pendingWinner);
}
function computerAutoPickHouse() {
  const st = typhoonState;
  const unclaimed = st.houses.filter((h) => !h.revealed);
  const house = unclaimed[Math.floor(Math.random() * unclaimed.length)];
  revealHouse(house, "P2");
}
function continueAfterReveal() {
  const st = typhoonState;
  if (st.houses.every((h) => h.revealed)) st.phase = "gameover";
  else nextTyphoonRound(st);
  renderApp();
}
function nextTyphoonRound(st) {
  st.currentWord = pickTyphoonWord(st.wordPool);
  st.phase = "answering";
  st.computerTimerId = null;
  st.computerStatus = "";
  st.pendingWinner = null;
}

// ===================== 7. ASTEROID TYPING =====================
const ASTEROID_LEVELS = [
  { speed: 0.05, spawnChance: 0.008, label: "Level 1" },
  { speed: 0.07, spawnChance: 0.011, label: "Level 2" },
  { speed: 0.09, spawnChance: 0.014, label: "Level 3" },
  { speed: 0.12, spawnChance: 0.018, label: "Level 4" },
  { speed: 0.16, spawnChance: 0.022, label: "Level 5" },
];
let asteroidState = null;
let asteroidSelectedPools = null;
let asteroidStartLevel = 1;
let asteroidMode = "romaji";
function renderAsteroid(app) {
  app.appendChild(el("h2", { class: "section-title", text: "Arcade — Asteroid Typing" }));
  app.appendChild(el("p", { class: "section-desc", text: "Type the reading (or meaning) of the highlighted (pink) asteroid before it crosses the danger line!" }));

  if (!asteroidSelectedPools) {
    asteroidSelectedPools = {};
    Object.keys(DATA.vocabPools).forEach((k) => (asteroidSelectedPools[k] = !(DATA.gameDefaultOff || []).includes(k)));
  }

  if (!asteroidState || !asteroidState.started) {
    renderAsteroidSetup(app);
    return;
  }

  const st = asteroidState;
  const statsRow = el("div", { class: "small", style: "margin-bottom:8px;font-weight:700;" });
  app.appendChild(statsRow);
  const gameArea = el("div", { style: "position:relative;width:100%;height:480px;background:linear-gradient(#041E42,#1a407a);border-radius:12px;overflow:hidden;" });
  app.appendChild(gameArea);
  const dangerLine = el("div", { style: "position:absolute;bottom:66px;left:0;right:0;height:2px;background:#E13B82;" });
  gameArea.appendChild(dangerLine);
  const ship = el("div", { style: "position:absolute;bottom:32px;left:50%;font-size:1.8rem;transform:translateX(-50%);", text: "🚀" });
  gameArea.appendChild(ship);

  // Typing box and controls live inside the game field itself, as a control bar along the bottom.
  const controlBar = el("div", { style: "position:absolute;left:0;right:0;bottom:0;background:rgba(4,30,66,0.85);padding:10px 12px;display:flex;gap:8px;align-items:center;" });
  const input = el("input", { type: "text", placeholder: st.mode === "translation" ? "Type the English meaning..." : "Type romaji here...", autofocus: "true", style: "flex:1;" });
  const pauseBtn = el("button", { class: "btn secondary", style: "flex-shrink:0;", text: st.paused ? "▶ Resume" : "⏸ Pause" });
  const quitBtn = el("button", { class: "btn secondary", style: "flex-shrink:0;", text: "End Game", onclick: () => { asteroidState.started = false; asteroidState.running = false; renderApp(); } });
  controlBar.appendChild(input); controlBar.appendChild(pauseBtn); controlBar.appendChild(quitBtn);
  gameArea.appendChild(controlBar);

  const levelConf = ASTEROID_LEVELS[st.level - 1];
  function updateStats() { statsRow.textContent = `${levelConf.label}   ·   Lives: ${"❤️".repeat(Math.max(st.lives, 0))}   ·   Hits: ${st.hits}   ·   Mode: ${st.mode === "translation" ? "Translation" : "Romaji"}`; }
  updateStats();

  let raf = null;
  function spawnAsteroid() {
    const word = st.wordPool[Math.floor(Math.random() * st.wordPool.length)];
    st.asteroids.push({ jp: word.jp, kana: word.kana || word.jp, en: word.en, alts: word.alts || [], accept: word.accept || [], x: Math.random() * 80 + 5, y: -5 });
  }
  function loop() {
    if (!st.running) { finishGame(); return; }
    if (st.paused) return; // resume() calls loop() again to restart the animation
    const conf = ASTEROID_LEVELS[st.level - 1];
    st.asteroids.forEach((a) => (a.y += conf.speed));
    st.asteroids = st.asteroids.filter((a) => {
      if (a.y >= 86) {
        st.lives--; updateStats();
        if (st.lives <= 0) { st.running = false; }
        return false;
      }
      return true;
    });
    if (Math.random() < conf.spawnChance) spawnAsteroid();
    draw();
    raf = requestAnimationFrame(loop);
  }
  function targetAsteroid() { return st.asteroids.reduce((best, a) => (!best || a.y > best.y ? a : best), null); }
  function draw() {
    gameArea.querySelectorAll(".asteroid").forEach((e) => e.remove());
    const target = targetAsteroid();
    st.asteroids.forEach((a) => {
      const isTarget = a === target;
      const label = a.jp;
      const d = el("div", { class: "asteroid jp", style: `position:absolute;left:${a.x}%;top:${a.y}%;max-width:140px;font-size:1.05rem;font-weight:800;color:${isTarget ? "#E13B82" : "#fff"};white-space:nowrap;`, text: label });
      gameArea.appendChild(d);
    });
  }
  function finishGame() {
    updateStats();
    const over = el("div", { style: "position:absolute;inset:0;background:rgba(4,30,66,0.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;gap:14px;", text: "Game Over — " + st.hits + " hits!" });
    const again = el("button", { class: "btn pink", style: "font-size:.85rem;", text: "Back to Setup", onclick: () => { asteroidState.started = false; renderApp(); } });
    over.appendChild(again);
    gameArea.appendChild(over);
  }
  pauseBtn.onclick = () => {
    st.paused = !st.paused;
    if (!st.paused) { renderApp(); loop(); }
    else renderApp();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || st.paused) return;
    const target = targetAsteroid();
    if (!target) return;
    const correct = st.mode === "translation" ? matchesAnyMeaning(input.value, target) : romajiMatches(input.value, target.kana, target.alts);
    if (correct) {
      st.asteroids = st.asteroids.filter((a) => a !== target);
      st.hits++;
      if (st.hits % 8 === 0 && st.level < 5) st.level++;
      updateStats(); draw();
    }
    input.value = "";
  });
  if (st.paused) {
    input.disabled = true;
    const pausedOverlay = el("div", { style: "position:absolute;inset:0;bottom:56px;background:rgba(4,30,66,0.6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;", text: "⏸ Paused" });
    gameArea.appendChild(pausedOverlay);
  }
  draw();
  if (!st.paused) loop();
}

function renderAsteroidSetup(app) {
  const card = el("div", { class: "card", style: "max-width:560px;" });
  card.appendChild(el("div", { style: "font-weight:800;color:var(--navy);margin-bottom:10px;", text: "Choose your word categories:" }));
  const checkGrid = el("div", { style: "display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px;" });
  Object.keys(DATA.vocabPools).forEach((k) => {
    const label = el("label", { class: "small", style: "display:flex;align-items:center;gap:8px;cursor:pointer;" });
    const cb = el("input", { type: "checkbox" });
    cb.checked = asteroidSelectedPools[k];
    cb.onchange = () => { asteroidSelectedPools[k] = cb.checked; };
    label.appendChild(cb); label.appendChild(document.createTextNode(POOL_LABELS[k]));
    checkGrid.appendChild(label);
  });
  card.appendChild(checkGrid);

  card.appendChild(el("div", { style: "font-weight:800;color:var(--navy);margin-bottom:10px;", text: "Starting level:" }));
  const levelRow = el("div", { style: "display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;" });
  ASTEROID_LEVELS.forEach((lvl, i) => {
    levelRow.appendChild(el("button", { class: "pool-btn" + (asteroidStartLevel === i + 1 ? " active" : ""), text: String(i + 1), onclick: () => { asteroidStartLevel = i + 1; renderApp(); } }));
  });
  card.appendChild(levelRow);
  card.appendChild(el("div", { class: "small", style: "margin-bottom:16px;", text: "Level 1 is slow and gentle; the game speeds up automatically as you get hits, up to Level 5. Starting higher skips the easier levels." }));

  card.appendChild(el("div", { style: "font-weight:800;color:var(--navy);margin-bottom:10px;", text: "Typing mode:" }));
  const modeRow = el("div", { style: "display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;" });
  [["romaji", "Romaji Mode"], ["translation", "Translation Mode"]].forEach(([id, label]) => {
    modeRow.appendChild(el("button", { class: "pool-btn" + (asteroidMode === id ? " active" : ""), text: label, onclick: () => { asteroidMode = id; renderApp(); } }));
  });
  card.appendChild(modeRow);
  card.appendChild(el("div", { class: "small", style: "margin-bottom:20px;", text: asteroidMode === "translation" ? "You'll see the Japanese word and type its English meaning." : "You'll see the Japanese word and type its romaji reading." }));

  const startBtn = el("button", { class: "btn pink", text: "Start Game", onclick: () => {
    const pools = Object.keys(asteroidSelectedPools).filter((k) => asteroidSelectedPools[k]);
    let wordPool = pools.flatMap((k) => DATA.vocabPools[k]);
    if (wordPool.length === 0) wordPool = DATA.allVocabForGames;
    asteroidState = { started: true, running: true, paused: false, level: asteroidStartLevel, mode: asteroidMode, asteroids: [], hits: 0, lives: 3, wordPool };
    renderApp();
  } });
  card.appendChild(startBtn);
  app.appendChild(card);
}
renderTabs(); renderApp();

</script>
