<style>
:root{
  --navy-dark:#041E42;
  --navy:#041E42;
  --navy-mid:#1a407a;
  --navy-tint:#eef3fa;
  --pink:#E13B82;
  --pink-light:#fbe1ec;
  --pink-hover:#b82f68;
  --border-light:#c8d4e8;
  --text-sec:#4d6a99;
  --text-en:#445566;
  --white:#ffffff;
  --green:#1f8a4c;
  --red:#c0392b;
  --amber:#b8791f;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{margin:0;font-family:'Montserrat',sans-serif;color:var(--text-en);background:var(--white);}
.jp{font-family:'Noto Sans JP',sans-serif;}
a{color:inherit;}
header.site-header{background:var(--navy-dark);border-bottom:6px solid var(--pink);padding:28px 40px;}
.header-inner{max-width:1180px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
.eyebrow{font-size:.68rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pink-light);margin:0 0 8px;}
.site-title{color:#fff;font-weight:800;font-size:1.9rem;margin:0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
.site-title .sub{font-size:1.05rem;font-weight:500;color:#cfe0f5;font-style:italic;}
.site-subheading{color:#9db4d6;font-size:.85rem;margin-top:6px;}
.badge{background:var(--pink);color:#fff;border-radius:20px;padding:8px 20px;font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
.container{max-width:1180px;margin:0 auto;padding:32px 40px 80px;}
nav.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;position:sticky;top:0;background:#fff;padding:14px 0;z-index:20;border-bottom:1px solid var(--border-light);}
.tab-btn{background:#fff;border:2px solid var(--border-light);border-radius:10px;padding:10px 18px;font-family:inherit;font-weight:800;font-size:.82rem;cursor:pointer;color:var(--navy);transition:.15s;}
.tab-btn:hover{border-color:var(--pink);}
.tab-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.pool-select{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px;}
.pool-btn{background:#fff;border:2px solid var(--border-light);border-radius:10px;padding:8px 16px;font-family:inherit;font-weight:700;font-size:.78rem;cursor:pointer;color:var(--text-sec);}
.pool-btn.active{background:var(--pink);border-color:var(--pink);color:#fff;}
h2.section-title{font-size:1.55rem;font-weight:800;color:var(--navy);letter-spacing:-.01em;margin:0 0 6px;}
p.section-desc{color:var(--text-sec);font-size:.85rem;margin:0 0 22px;max-width:760px;}
.card{background:#fff;border:1.5px solid var(--border-light);border-radius:14px;padding:18px;transition:.15s;}
.card:hover{box-shadow:0 4px 12px rgba(0,20,50,.08);border-color:var(--pink);}
.btn{border-radius:9px;font-family:inherit;font-weight:800;font-size:.8rem;padding:10px 20px;cursor:pointer;border:2px solid var(--navy);background:var(--navy);color:#fff;}
.btn.secondary{background:#fff;color:var(--navy);}
.btn.pink{background:var(--pink);border-color:var(--pink);}
.btn.pink.outline{background:#fff;color:var(--pink);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.grid{display:grid;gap:16px;}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-1{grid-template-columns:1fr;}
.link-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--navy-tint);border-radius:12px;padding:10px 14px;margin:0 0 18px;}
.link-label{font-size:.78rem;font-weight:800;color:var(--navy);margin-right:4px;}
.link-btn{background:#fff;border:2px solid var(--pink);color:var(--pink);border-radius:10px;padding:6px 14px;font-family:inherit;font-weight:700;font-size:.78rem;cursor:pointer;}
.link-btn:hover{background:var(--pink);color:#fff;}
.explain-cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:20px;}
.rules-card{padding:22px 24px;}
.rules-h{font-size:1.05rem;color:var(--navy);margin:0 0 14px;font-weight:800;}
.rules-card .rules-h:not(:first-child){margin-top:28px;padding-top:22px;border-top:1px solid var(--border-light);}
.rules-list{margin:0;padding-left:22px;font-size:1rem;line-height:1.7;color:var(--navy);}
.rules-list li{margin-bottom:12px;}
.rules-list li:last-child{margin-bottom:0;}
.rules-list.tips{list-style:none;padding-left:0;}

const FURI_KEYS = Object.keys(FURIGANA).sort((a, b) => b.length - a.length);
function appendFurigana(parent, text) {
  let plain = "";
  const flush = () => { if (plain) { parent.appendChild(document.createTextNode(plain)); plain = ""; } };
  let i = 0;
  while (i < text.length) {
    const key = FURI_KEYS.find((k) => text.startsWith(k, i));
    if (!key) { plain += text[i]; i++; continue; }
    flush();
    FURIGANA[key].forEach(([base, reading]) => {
      if (!reading) { parent.appendChild(document.createTextNode(base)); return; }
      const ruby = document.createElement("ruby");
      ruby.appendChild(document.createTextNode(base));
      const rt = document.createElement("rt");
      rt.textContent = reading;
      ruby.appendChild(rt);
      parent.appendChild(ruby);
    });
    i += key.length;
  }
  flush();
}
function setFurigana(e, text) { e.textContent = ""; appendFurigana(e, text); return e; }
function el(tag, opts = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(opts).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) { if (typeof v === "function") e.addEventListener(k.slice(2), v); }
    else if (v === false || v === null || v === undefined) { /* skip: no attribute */ }
    else e.setAttribute(k, v);
  });
  children.forEach((c) => c && e.appendChild(c));
  return e;
}

// Simple hiragana -> romaji converter (covers the kana used in this unit)
const ROMAJI_MAP = {
  "あ":"a","い":"i","う":"u","え":"e","お":"o","か":"ka","き":"ki","く":"ku","け":"ke","こ":"ko",
  "が":"ga","ぎ":"gi","ぐ":"gu","げ":"ge","ご":"go","さ":"sa","し":"shi","す":"su","せ":"se","そ":"so",
  "ざ":"za","じ":"ji","ず":"zu","ぜ":"ze","ぞ":"zo","た":"ta","ち":"chi","つ":"tsu","て":"te","と":"to",
  "だ":"da","ぢ":"ji","づ":"zu","で":"de","ど":"do","な":"na","に":"ni","ぬ":"nu","ね":"ne","の":"no",
  "は":"ha","ひ":"hi","ふ":"fu","へ":"he","ほ":"ho","ば":"ba","び":"bi","ぶ":"bu","べ":"be","ぼ":"bo",
  "ぱ":"pa","ぴ":"pi","ぷ":"pu","ぺ":"pe","ぽ":"po","ま":"ma","み":"mi","む":"mu","め":"me","も":"mo",
  "や":"ya","ゆ":"yu","よ":"yo","ら":"ra","り":"ri","る":"ru","れ":"re","ろ":"ro","わ":"wa","を":"wo","ん":"n",
  "ー":"-","、":",","。":".","っ":"", // handled specially
  "きゃ":"kya","きゅ":"kyu","きょ":"kyo","しゃ":"sha","しゅ":"shu","しょ":"sho","ちゃ":"cha","ちゅ":"chu","ちょ":"cho",
  "にゃ":"nya","にゅ":"nyu","にょ":"nyo","ひゃ":"hya","ひゅ":"hyu","ひょ":"hyo","みゃ":"mya","みゅ":"myu","みょ":"myo",
  "りゃ":"rya","りゅ":"ryu","りょ":"ryo","ぎゃ":"gya","ぎゅ":"gyu","ぎょ":"gyo","じゃ":"ja","じゅ":"ju","じょ":"jo",
  "びゃ":"bya","びゅ":"byu","びょ":"byo","ぴゃ":"pya","ぴゅ":"pyu","ぴょ":"pyo",
  "てぃ":"ti","でぃ":"di","ふぁ":"fa","ふぃ":"fi","ふぇ":"fe","ふぉ":"fo","うぃ":"wi","うぇ":"we","うぉ":"wo","ちぇ":"che","しぇ":"she","じぇ":"je",
};
function kanaToRomaji(input) {
  if (!input) return "";
  // katakana is read exactly like hiragana, so convert it first (the middle dot is silent)
  input = input.replace(/[\u30A1-\u30F6]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/・/g, "");
  const chars = Array.from(input);
  let out = "";
  for (let i = 0; i < chars.length; i++) {
    const c = chars[i];
    const next = chars[i + 1];
    if (c === "っ" && next) {
      const nextRomaji = ROMAJI_MAP[next] || ROMAJI_MAP[chars[i + 1] + (chars[i + 2] || "")] || "";
      out += nextRomaji.startsWith("ch") ? "t" : nextRomaji.charAt(0);
      continue;
    }
    const twoChar = c + (next || "");
    if (ROMAJI_MAP[twoChar] && "ゃゅょぁぃぅぇぉ".includes(next)) {
      out += ROMAJI_MAP[twoChar];
      i++;
      continue;
    }
    out += ROMAJI_MAP[c] !== undefined ? ROMAJI_MAP[c] : c;
  }
  return out;
}

// Accepts the typed romaji whether the long vowel is typed with a hyphen (so-), doubled (soo) or dropped (so),
// and either "tch" or "cch" for a small っ before ち.
function romajiMatches(input, kanaStr) {
  const val = (input || "").trim().toLowerCase();
  if (!val) return false;
  const base = kanaToRomaji(kanaStr).trim().toLowerCase();
  const variants = new Set([base, base.replace(/([aiueo])-/g, "$1$1"), base.replace(/-/g, "")]);
  [...variants].forEach((x) => variants.add(x.replace(/tch/g, "cch")));
  return variants.has(val);
}

// Mora splitter — small kana (ゃゅょ) attach to the preceding character, matching the booklet's tracing grids.
function splitMorae(reading) {
  const smalls = new Set(["ゃ", "ゅ", "ょ", "ャ", "ュ", "ョ", "ぁ", "ぃ", "ぅ", "ぇ", "ぉ", "ァ", "ィ", "ゥ", "ェ", "ォ"]);
  const chars = Array.from(reading || "");
  const morae = [];
  for (const ch of chars) {
    if (smalls.has(ch) && morae.length > 0) morae[morae.length - 1] += ch;
    else morae.push(ch);
  }
  return morae;
}

function shuffle(a) { return shuffleArr(a); }

// Some vocab items list more than one valid English meaning (e.g. "Clubs / Activities",
// "Break / Morning Tea"). Typing any single one of them counts as correct everywhere we check English answers.
function matchesAnyMeaning(input, correctEn) {
  const val = (input || "").trim().toLowerCase();
  if (!val) return false;
  const alternatives = correctEn.split("/").map((s) => s.trim().toLowerCase());
  return alternatives.includes(val);
}

function rowsFor(layout, allKeys) {
  const rows = (layout || []).map((r) => r.filter((k) => allKeys.includes(k))).filter((r) => r.length);
  const placed = new Set(rows.flat());
  const rest = allKeys.filter((k) => !placed.has(k));
  if (rest.length) rows.push(rest);
  return rows;
}

function traceCard(v) {
  const word = v.jp;
  const reading = v.kana || v.jp; // kana reading — used for TTS and shown under kanji
  const morae = splitMorae(reading);
  const card = el("div", { class: "card" });
  const top = el("div", { style: "display:flex;justify-content:space-between;align-items:center;" });
  top.appendChild(setFurigana(el("span", {
    class: "jp jp-word", "data-tooltip": v.en, style: "font-size:1.5rem;font-weight:700;color:var(--navy);",
    onclick: () => speak(reading),
  }), word));
  top.appendChild(el("button", { class: "btn secondary", style: "padding:6px 12px;", text: "🔊", onclick: () => speak(reading) }));
  card.appendChild(top);
  if (v.kana && !/[\u4e00-\u9fff]/.test(word)) card.appendChild(el("div", { class: "jp small", style: "margin:4px 0;color:var(--text-sec);", text: v.kana })); // kanji words show their reading as furigana instead
  card.appendChild(el("div", { class: "small", style: "margin-bottom:8px;", text: "Meaning: " + v.en }));
  const row = el("div", { class: "mora-row" });
  card.appendChild(row);
  const clearBtn = el("button", { class: "btn secondary", style: "margin-top:8px;padding:6px 14px;font-size:.7rem;", text: "Clear" });
  card.appendChild(clearBtn);
  const clearFns = [];
  morae.forEach((mora) => {
    const canvas = el("canvas", { class: "mora-box", width: "170", height: "170" });
    row.appendChild(canvas);
    setTimeout(() => {
      const ctx = canvas.getContext("2d");
      function drawGuide() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = "#eef1f6"; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(canvas.width / 2, 4); ctx.lineTo(canvas.width / 2, canvas.height - 4);
        ctx.moveTo(4, canvas.height / 2); ctx.lineTo(canvas.width - 4, canvas.height / 2); ctx.stroke();
        ctx.font = "88px 'Noto Sans JP'"; ctx.fillStyle = "rgba(4,30,66,0.18)";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(mora, canvas.width / 2, canvas.height / 2 + 2);
      }
      drawGuide();
      clearFns.push(drawGuide);
      let drawing = false, last = null;
      function pos(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) }; }
      canvas.addEventListener("pointerdown", (e) => { drawing = true; last = pos(e); });
      canvas.addEventListener("pointermove", (e) => {
        if (!drawing) return;
        const p = pos(e);
        ctx.strokeStyle = "#041E42"; ctx.lineWidth = 5; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
        last = p;
      });
      window.addEventListener("pointerup", () => (drawing = false));
    }, 0);
  });
  clearBtn.onclick = () => clearFns.forEach((f) => f());
  return card;
}

const ROLE_LABEL = { ...ROLE_LABEL_BASE, suffix: "suffix", counter: "counter / number", connective: "connective", interrogative: "interrogative" };

// Word-level hover glossary: vocabulary words (from the pools) plus common particles/predicate pieces.
const PARTICLE_GLOSSARY = {
  "が": "marks the thing being liked, disliked, or described (subject marker)",
  "は": "topic marker — ‘as for...’",
  "の": "possessive / connecting particle (‘s or ‘of’)",

  "でき": "can do (verb stem)",

  "できません": "cannot do",

};
Object.assign(PARTICLE_GLOSSARY, {"に": "marks the target — where you belong or what you become (‘in’, ‘into’)", "から": "because (gives the reason)", "だ": "is — needed after a な-adjective before と or から", "や": "and (one of several things)", "など": "and so on / etc.", "を": "marks what you study (the object)", "へ": "to (marks who the letter is for)", "より": "from (marks who the letter is from)", "という": "called / named", "さん": "Mr / Ms (polite ending for a name)", "なん": "what", "なに": "what", "いつ": "when", "どうして": "why", "ですか": "is it…? (question ending)", "はいっていますか": "are you a member of…?", "おもいます": "I think", "おてがみ": "letter", "おへんじ": "reply", "ゆい": "Yui (the pen pal)", "エマ": "Emma (the letter writer)", "セント・エイダンズ女子校": "St Aidan's Girls' School", "好きな": "favourite / liked (好き + な before a noun)"});
let WORD_GLOSSARY = null;
function getWordGlossary() {
  if (WORD_GLOSSARY) return WORD_GLOSSARY;
  WORD_GLOSSARY = { ...PARTICLE_GLOSSARY };
  Object.values(DATA.vocabPools).forEach((pool) => pool.forEach((v) => { WORD_GLOSSARY[v.jp] = v.en; }));
  return WORD_GLOSSARY;
}
function glossFor(text) {
  const glossary = getWordGlossary();
  if (glossary[text] !== undefined) return glossary[text];
  const stripped = text.replace(/[。、]/g, "");
  return glossary[stripped];
}

// One line of a sentence frame, written as  text/role|text/role  ([square brackets] mark the part students swap).
function frameLine(dsl, cls) {
  const p = el("p", { class: cls });
  dsl.split("|").forEach((part) => {
    const k = part.lastIndexOf("/");
    const text = part.slice(0, k), role = part.slice(k + 1);
    if (!role || role === "-") appendFurigana(p, text);
    else p.appendChild(setFurigana(el("span", { class: "token role-" + role }), text));
  });
  return p;
}
function tokenLine(tokens) {
  const p = el("p", { class: "jp", style: "font-size:1.2rem;line-height:2.3;margin:2px 0 8px;flex:1;" });
  tokens.forEach((t) => {
    const gloss = glossFor(t.t);
    const span = setFurigana(el("span", { class: t.r ? "token role-" + t.r : "token" }), t.t);
    if (gloss) span.setAttribute("data-tooltip", gloss);
    span.style.cursor = "pointer";
    span.addEventListener("click", (e) => { e.stopPropagation(); speak(t.t); });
    p.appendChild(span);
  });
  return p;
}

e, who it's to (name + さん + へ), greeting, introduction, your news, a closing line, and a sign-off (your name + より). The sentences below are the building blocks; tap any line to hear it."});

// ===================== FREE WRITING: write in your book, then rebuild it here to check the grammar =====================
const BREAK_TILE = "⏎";
const POOL_ROLE = { subjects: "subject", schoolNouns: "subject", schoolLevels: "place", yearLevels: "place", studyWords: "manner", adjectives: "adjective", periods: "counter", days: "timeGeneral", sports: "subject", music: "subject", clubs: "subject", clubWords: "timeSpecific", letterPhrases: null };
const CAT_LABEL = {
  subject: "a school subject (for example えいご)", topic: "a subject or a school word (for example えいご or 先生)", adj: "an adjective",
  adjI: "an い-adjective (for example たのしい)", adjNa: "a な-adjective (for example かんたん)", day: "a day (for example 月よう日)",
  period: "a period (for example 一じかんめ)", activity: "a club, team or ensemble (for example ネットボールぶ)", time: "a time of day (あさ, ひるやすみ or ほうかご)",
  level: "a school level (小学校, 中学校 or 高校)", yearlevel: "a year level (for example 中学二年生)", num: "a number (一, 二, 三…)", school: "the school name (セント・エイダンズ女子校)", name: "a name (for example エマ)",
};

function stripFinalStop(t) { return t.endsWith("。") && t !== "ちょっと。。。" ? t.slice(0, -1) : t; }

// Grammar words for a page = every fixed word (and every choice) in its sentence frames.
function tilesFromFrames(groups) {
  const out = [];
  const add = (text, role) => { if (text && !out.some((o) => o.text === text)) out.push({ text, role: role || null }); };
  let needNum = false, needSchool = false, needName = false;
  groups.forEach((g) => (g.frames || []).forEach((f) => {
    if (f.jp.includes("[number]")) needNum = true;
    if (f.jp.includes("[school name]")) needSchool = true;
    if (f.jp.includes("[name]")) needName = true;
    if (f.jp.includes("teacher")) add("先生", "subject");
    f.jp.split("|").forEach((part) => {
      const k = part.lastIndexOf("/");
      let text = part.slice(0, k);
      const role = part.slice(k + 1) === "-" ? null : part.slice(k + 1);
      const m = text.match(/\[([^\]]+)\]/);
      if (m) {
        if (/[A-Za-z]/.test(m[1])) return; // a placeholder such as [subject]: those words come from the word lists
        m[1].split("・").forEach((o) => add(o, role)); // a choice such as [好き・大好き・好きじゃない]
        if (m[1].includes("小学校")) { add("小学", role); add("中学", role); } // 中学二年生 is also fine: the 校 can be dropped
        return;
      }
      text = text.replace(/[()]/g, ""); // (だ)
      if (text === "、" || text === "。") return;
      add(stripFinalStop(text), role);
    });
  }));
  // plain words that a page's patterns need (for example ちょっと。。。)
  groups.forEach((g) => (g.patterns || []).forEach((pt) => {
    const walk = (n) => { if (n.tok !== undefined) add(n.tok, null); else if (n.seq) n.seq.forEach(walk); else if (n.alt) n.alt.forEach(walk); else if (n.rep) walk(n.rep); };
    walk(parsePattern(pt.p));
  }));
  if (needNum) "一二三四五六".split("").forEach((n) => add(n, "counter"));
  if (needSchool) add("セント・エイダンズ女子校", "place");
  if (needName) ["ゆい", "エマ"].forEach((n) => add(n, "subject"));
  return out;
}

function buildBank(group) {
  const isLetters = group.key === "letters"; // a letter can use any pattern from any page
  const groups = isLetters ? DATA.grammarGroups : [group];
  const poolKeys = isLetters ? Object.keys(DATA.vocabPools) : linkedPools(group).filter((k) => DATA.vocabPools[k]);
  const seen = new Set();
  const take = (arr) => arr.filter((t) => (seen.has(t.text) ? false : (seen.add(t.text), true)));
  const sections = [];
  const grammar = take(tilesFromFrames(groups));
  grammar.push(...take([{ text: "、", role: null }, { text: "。", role: null }, { text: BREAK_TILE, role: null }]));
  sections.push({ title: "Grammar words, endings and punctuation", tiles: grammar, open: true });
  poolKeys.forEach((k) => {
    const tiles = take(DATA.vocabPools[k].map((v) => ({ text: v.jp, role: POOL_ROLE[k] || null })));
    if (tiles.length) sections.push({ title: POOL_LABELS[k], tiles, open: !isLetters });
  });
  return sections;
}

// ---- a tiny pattern language: ( a | b ), ?, +, *, <category>
const _patCache = new Map();
function parsePattern(str) {
  if (_patCache.has(str)) return _patCache.get(str);
  const toks = str.match(/<[^>]+>|[()|?+*]|[^\s()|?+*<>]+/g);
  let i = 0;
  function parseAlt() { const seqs = [parseSeq()]; while (toks[i] === "|") { i++; seqs.push(parseSeq()); } return seqs.length === 1 ? seqs[0] : { alt: seqs }; }
  function parseSeq() { const items = []; while (i < toks.length && toks[i] !== "|" && toks[i] !== ")") items.push(parseItem()); return { seq: items }; }
  function parseItem() { let a = parseAtom(); while (toks[i] === "?" || toks[i] === "+" || toks[i] === "*") { a = { rep: a, q: toks[i] }; i++; } return a; }
  function parseAtom() { const t = toks[i++]; if (t === "(") { const a = parseAlt(); i++; return a; } if (t[0] === "<") return { cat: t.slice(1, -1) }; return { tok: t }; }
  const ast = parseAlt();
  _patCache.set(str, ast);
  return ast;
}

function makeCategories(customWords) {
  const P = DATA.vocabPools;
  const words = (k) => (P[k] || []).map((v) => v.jp);
  const sets = {
    subject: new Set(words("subjects")),
    topic: new Set([...words("subjects"), ...words("schoolNouns")]),
    adj: new Set(words("adjectives")),
    adjI: new Set((P.adjectives || []).filter((v) => !v.na).map((v) => v.jp)),
    adjNa: new Set((P.adjectives || []).filter((v) => v.na).map((v) => v.jp)),
    day: new Set(words("days")),
    period: new Set(words("periods")),
    activity: new Set([...words("sports"), ...words("music"), ...words("clubs")]),
    time: new Set(["あさ", "ひるやすみ", "ほうかご"]),
    level: new Set(["小学校", "中学校", "高校", "小学", "中学"]),
    yearlevel: new Set(words("yearLevels")),
    num: new Set("一二三四五六七八九十".split("")),
    school: new Set(["セント・エイダンズ女子校"]),
    name: new Set(["ゆい", "エマ", ...customWords]),
  };
  return (c) => sets[c] || new Set();
}

function runMatcher(ast, tiles, cat, budget = 0) {
  const st = { furthest: -1, expected: {}, subst: null };
  let left = budget; // how many wrong words we are allowed to ignore (used to find "one word is wrong" hints)
  const note = (pos, what) => { if (pos > st.furthest) { st.furthest = pos; st.expected = {}; } if (pos === st.furthest) st.expected[what] = true; };
  function m(node, pos, k) {
    if (node.tok !== undefined) {
      if (tiles[pos] === node.tok) return k(pos + 1);
      if (left > 0 && pos < tiles.length) { left--; const prev = st.subst; st.subst = { pos, what: node.tok }; if (k(pos + 1)) return true; left++; st.subst = prev; }
      note(pos, node.tok); return false;
    }
    if (node.cat !== undefined) {
      if (pos < tiles.length && cat(node.cat).has(tiles[pos])) return k(pos + 1);
      if (left > 0 && pos < tiles.length) { left--; const prev = st.subst; st.subst = { pos, what: "<" + node.cat + ">" }; if (k(pos + 1)) return true; left++; st.subst = prev; }
      note(pos, "<" + node.cat + ">"); return false;
    }
    if (node.seq) { const go = (i, p) => (i === node.seq.length ? k(p) : m(node.seq[i], p, (np) => go(i + 1, np))); return go(0, pos); }
    if (node.alt) return node.alt.some((a) => m(a, pos, k));
    if (node.rep) {
      if (node.q === "?") return m(node.rep, pos, k) || k(pos);
      const star = (p) => m(node.rep, p, (np) => np > p && star(np)) || k(p);
      return node.q === "*" ? star(pos) : m(node.rep, pos, (np) => star(np));
    }
    return false;
  }
  const ok = m(ast, 0, (p) => { if (p === tiles.length) return true; note(p, "(end)"); return false; });
  return { ok, furthest: st.furthest, expected: Object.keys(st.expected), subst: ok ? st.subst : null };
}

function splitSentences(texts) {
  const sentences = [];
  let cur = [];
  const push = () => { const c = cur.filter((t) => t !== "、"); if (c.length) sentences.push(c); cur = []; };
  texts.forEach((t) => {
    if (t === "。" || t === BREAK_TILE) { push(); return; }
    cur.push(t);
    if (t.endsWith("。。。")) push();
  });
  push();
  return sentences;
}

function describeExpected(list) {
  const nice = list.filter((x) => x !== "(end)").map((x) => (x[0] === "<" ? CAT_LABEL[x.slice(1, -1)] || x : "「" + x + "」"));
  const uniq = [...new Set(nice)];
  return uniq.length > 5 ? uniq.slice(0, 5).join(", or ") + ", …" : uniq.join(", or ");
}

function checkSentence(tiles, patterns, otherPages, cat) {
  const results = patterns.map((p) => ({ label: p.label, ...runMatcher(parsePattern(p.p), tiles, cat) }));
  const hit = results.find((r) => r.ok);
  if (hit) return { status: "ok", msg: "✓ This matches the pattern: " + hit.label + "." };
  for (const o of otherPages) {
    if (o.patterns.some((p) => runMatcher(parsePattern(p.p), tiles, cat).ok)) {
      return { status: "alt", msg: "✓ This is correct Japanese, but it belongs to a different page (" + o.title + "). Check the question again." };
    }
  }
  // The だ rule first: な-adjectives need だ before と / から, い-adjectives never take it
  const naWords = (DATA.vocabPools.adjectives || []).filter((v) => v.na).map((v) => v.jp);
  const iWords = (DATA.vocabPools.adjectives || []).filter((v) => !v.na).map((v) => v.jp);
  for (let i = 0; i < tiles.length - 1; i++) {
    if (naWords.includes(tiles[i]) && (tiles[i + 1] === "と" || tiles[i + 1] === "から")) return { status: "no", msg: "✗ " + tiles[i] + " is a な-adjective, so it needs だ after it: " + tiles[i] + "だ" + tiles[i + 1] + "…" };
    if (iWords.includes(tiles[i]) && tiles[i + 1] === "だ") return { status: "no", msg: "✗ " + tiles[i] + " is an い-adjective, so it doesn't take だ. Take だ out: " + tiles[i] + tiles[i + 2] + "…" };
  }
  // Is it just one wrong word? (for example は where が is needed)
  for (const p of patterns) {
    const r = runMatcher(parsePattern(p.p), tiles, cat, 1);
    if (r.ok && r.subst) {
      const w = tiles[r.subst.pos];
      const want = r.subst.what[0] === "<" ? CAT_LABEL[r.subst.what.slice(1, -1)] || r.subst.what : "「" + r.subst.what + "」";
      const where = r.subst.pos === 0 ? "at the start" : "after 「" + tiles.slice(0, r.subst.pos).join("") + "」";
      return { status: "no", msg: "✗ Check the word 「" + w + "」: " + where + " I expected " + want + " (for the pattern: " + p.label + ")." };
    }
  }
  const best = Math.max(...results.map((r) => r.furthest));
  const expected = [...new Set(results.filter((r) => r.furthest === best).flatMap((r) => r.expected))];
  const before = tiles.slice(0, best).join("");
  const prev = tiles[best - 1];
  const naList = (DATA.vocabPools.adjectives || []).filter((v) => v.na).map((v) => v.jp);
  const iList = (DATA.vocabPools.adjectives || []).filter((v) => !v.na).map((v) => v.jp);
  let msg;
  if (tiles[best] === "だ" && iList.includes(prev)) msg = "✗ い-adjectives like " + prev + " don't need だ. Take だ out.";
  else if (expected.includes("だ") && naList.includes(prev)) msg = "✗ " + prev + " is a な-adjective, so it needs だ after it.";
  else if (best <= 0) msg = "✗ I wasn't sure how to start this sentence. Try starting with: " + describeExpected(expected) + "." + (expected.includes("<name>") ? " (To use your own name, type it in the “Add your own word” box.)" : "");
  else if (expected.length === 1 && expected[0] === "(end)") msg = "✗ There are extra words after 「" + before + "」. Take them out, or check the pattern.";
  else if (best >= tiles.length) msg = "✗ The sentence stops after 「" + before + "」. What comes next? I expected: " + describeExpected(expected) + ".";
  else msg = "✗ After 「" + before + "」 I expected: " + describeExpected(expected) + ". You have 「" + tiles[best] + "」.";
  return { status: "no", msg };
}

function checkAnswer(group, answerTexts, customWords) {
  const cat = makeCategories(customWords);
  const own = group.patterns || [];
  const patterns = group.key === "letters" ? [...own, ...DATA.grammarGroups.filter((g) => g !== group).flatMap((g) => g.patterns || [])] : own;
  const otherPages = group.key === "letters" ? [] : DATA.grammarGroups.filter((g) => g !== group && g.patterns);
  return splitSentences(answerTexts).map((tiles) => ({ text: tiles.join(""), ...checkSentence(tiles, patterns, otherPages, cat) }));
}

  } }));

  });
  card.appendChild(el("div", { class: "free-title", style: "font-size:1rem;margin:22px 0 2px;", text: "Word bank" }));
  card.appendChild(bank);
  redrawAnswer();
  body.appendChild(card);
}

let flashcardPools = []; // word lists chosen for flashcards: starts with none selected
let flashcardDirection = "jToE"; // "jToE" or "eToJ"

// Every word from the chosen lists, without doubling up a word that appears in more than one list.
function flashcardWords(keys) {
  const seen = new Set();
  const out = [];
  keys.forEach((k) => (DATA.vocabPools[k] || []).forEach((v) => {
    const id = v.jp + "|" + v.en;
    if (!seen.has(id)) { seen.add(id); out.push(v); }

}
// The shared "choose one or more word lists" picker (used by Timed Matching and Asteroid Typing).

let boardStage = 0;
let boardFilterStar = false;
let scriptList = [];
let boardSelections = {}; // key: `${stageIdx}:${slotId}` -> chosen vocab index

function getSlotChoice(stageIdx, slot) {
  const key = stageIdx + ":" + slot.id;
  return boardSelections[key] !== undefined ? boardSelections[key] : slot.default;
}
function setSlotChoice(stageIdx, slotId, idx) {
  boardSelections[stageIdx + ":" + slotId] = idx;
}
// Resolve a template string like "{s0}が好きですか。" using the current slot choices.
function resolveTpl(str, slotValues) {
  return str.replace(/\{(\w+?)(_en)?(_lower)?(_da)?\}/g, (match, id, enFlag, lowerFlag, daFlag) => {
    const v = slotValues[id];
    if (!v) return match;
    let out = enFlag ? v.en : v.jp;
    if (lowerFlag) out = out.toLowerCase();
    if (daFlag && v.na) out += "だ"; // な-adjectives need だ before と / から
    return out;
  });
}

// Parses a template string like "そうですか。{s1}は？", rendering fixed text as glossed/tappable
// spans and each {slotId} as an inline <select> dropdown the student can change in place.
function renderInlineTemplatedJp(container, tplStr, slotsById, slotValues, glossary) {
  const regex = /\{(\w+?)(_da)?\}/g;
  let lastIndex = 0;
  let match;
  while ((match = regex.exec(tplStr))) {
    const textBefore = tplStr.slice(lastIndex, match.index);
    if (textBefore) appendGlossedText(container, textBefore, glossary);
    const slot = slotsById[match[1]];
    if (slot) {
      const select = el("select", {
        class: "jp inline-slot-select",
        "data-tooltip": slotValues[slot.id].en,
      });
      DATA.vocabPools[slot.pool].forEach((v, i) => { if (!slot.only || slot.only.includes(i)) select.appendChild(el("option", { value: String(i), text: v.jp })); });
      select.value = String(getSlotChoice(boardStage, slot));
      select.addEventListener("click", (e) => e.stopPropagation());
      select.onchange = () => { setSlotChoice(boardStage, slot.id, Number(select.value)); renderApp(); };
      container.appendChild(select);
      if (match[2] && slotValues[slot.id].na) container.appendChild(document.createTextNode("だ"));
    } else {
      container.appendChild(document.createTextNode(match[0]));
    }
    lastIndex = regex.lastIndex;
  }
  const rest = tplStr.slice(lastIndex);
  if (rest) appendGlossedText(container, rest, glossary);
}
// Greedy longest-match tokeniser: wraps any known vocabulary word in a tappable span.
function appendGlossedText(container, text, glossary) {
  const keys = Object.keys(glossary).sort((a, b) => b.length - a.length);
  let i = 0;
  while (i < text.length) {
    let matched = null;
    for (const k of keys) {
      if (text.startsWith(k, i)) { matched = k; break; }
    }
    if (matched) {
      container.appendChild(el("span", { style: "cursor:pointer;border-bottom:1.5px dotted var(--pink);", "data-tooltip": glossary[matched], onclick: (e) => { e.stopPropagation(); speak(matched); alertGloss(e.target, glossary[matched]); } , text: matched}));
      i += matched.length;
    } else {
      container.appendChild(document.createTextNode(text[i]));
      i += 1;
    }
  }
}
function alertGloss(target, meaning) {
  const existing = document.getElementById("glossPop"); if (existing) existing.remove();
  const pop = el("div", { id: "glossPop", style: "position:fixed;background:#fff;color:var(--pink);border:2px solid var(--pink);padding:6px 12px;border-radius:10px;font-family:'Montserrat',sans-serif;font-size:.72rem;font-weight:700;box-shadow:0 4px 14px rgba(0,20,50,.18);z-index:200;" , text: meaning});
  document.body.appendChild(pop);
  const r = target.getBoundingClientRect();
  pop.style.left = r.left + "px"; pop.style.top = (r.bottom + 6) + "px";
  setTimeout(() => pop.remove(), 1800);
}

// ===================== 5. TIMED MATCHING =====================
let matchPools = []; // word lists chosen for timed matching: starts with none selected
const MATCH_MAX = 24; // words per game (a single list is never cut: the biggest has 22)
let matchState = null;
let matchBest = null;
function renderMatching(app) {
  app.appendChild(el("h2", { class: "section-title", text: "Timed Matching" }));
  app.appendChild(el("p", { class: "section-desc", text: "Drag each Japanese tile onto its matching English tile as fast as you can." }));
  if (!matchState) {
    const picker = el("div", { class: "card", style: "max-width:720px;margin-bottom:16px;" });
    picker.appendChild(listPicker(matchPools, (keys) => { matchPools = keys; matchState = null; matchBest = null; renderApp(); }, "words"));
    app.appendChild(picker);
    if (!matchPools.length) {
      app.appendChild(el("div", { class: "small", style: "font-weight:700;", text: "Choose at least one word list to start the game." }));
      return;
    }
    const total = flashcardWords(matchPools).length;
    const card = el("div", { class: "card", style: "max-width:520px;" }, [
      el("div", { class: "small", style: "margin-bottom:14px;", text: (total > MATCH_MAX ? `Each game uses ${MATCH_MAX} of the ${total} words in your lists, picked at random.` : `Ready to match all ${total} words in your ${matchPools.length > 1 ? "lists" : "list"}?`) + " The timer starts as soon as you begin." }),
      el("button", { class: "btn pink", text: "Start Game", onclick: () => { startMatchGame(); renderApp(); } }),
    ]);
    app.appendChild(card);
    return;
  }

  const info = el("div", { class: "small", style: "margin-bottom:10px;" });
  app.appendChild(info);
  const board = el("div", { style: "position:relative;width:100%;background:var(--navy-tint);border-radius:12px;overflow:hidden;" });
  app.appendChild(board);
  const restartBtn = el("button", { class: "btn pink", style: "margin-top:12px;", text: "Shuffle Board", onclick: () => { matchState = null; renderApp(); } });
  app.appendChild(restartBtn);

  const st = matchState;
  board.style.height = st.boardHeight + "px";
  function updateInfo() {
    let timeStr = "—";
    if (st.startTime) { const end = st.endTime || Date.now(); timeStr = ((end - st.startTime) / 1000).toFixed(1) + "s"; }
    info.textContent = `Matched: ${st.matched} / ${st.total}   ·   Time: ${timeStr}   ·   Best: ${matchBest ? matchBest.toFixed(1) + "s" : "—"}`;
  }
  updateInfo();
  let ticker = setInterval(() => { if (st.startTime && !st.endTime) updateInfo(); else clearInterval(ticker); }, 200);

  st.tiles.forEach((t) => {
    if (t.done) return;
    const tileEl = el("div", {
      class: t.type === "jp" ? "card jp" : "card",
      style: `position:absolute;left:${t.x}%;top:${t.y}%;padding:8px 14px;cursor:grab;background:#fff;font-size:.85rem;white-space:nowrap;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,.1);`,
      text: t.text,
    });
    tileEl.dataset.id = t.id; tileEl.dataset.type = t.type;
    board.appendChild(tileEl);
    let dragging = false, offX = 0, offY = 0;
    tileEl.addEventListener("pointerdown", (e) => {
      dragging = true; tileEl.style.cursor = "grabbing"; tileEl.style.zIndex = 10;
      if (!st.startTime) { st.startTime = Date.now(); updateInfo(); }
      const r = board.getBoundingClientRect();
      offX = e.clientX - tileEl.getBoundingClientRect().left; offY = e.clientY - tileEl.getBoundingClientRect().top;
      tileEl.setPointerCapture(e.pointerId);
    });
    tileEl.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      const r = board.getBoundingClientRect();
      let nx = ((e.clientX - r.left - offX) / r.width) * 100;
      let ny = ((e.clientY - r.top - offY) / r.height) * 100;
      tileEl.style.left = nx + "%"; tileEl.style.top = ny + "%";
    });
    tileEl.addEventListener("pointerup", (e) => {
      dragging = false; tileEl.style.cursor = "grab"; tileEl.style.zIndex = 1;
      tileEl.style.pointerEvents = "none";
      const under = document.elementFromPoint(e.clientX, e.clientY);
      tileEl.style.pointerEvents = "";
      if (under && under.dataset && under.dataset.id === String(t.id) && under.dataset.type !== t.type && under !== tileEl) {
        tileEl.style.background = "#d9f5e3"; under.style.background = "#d9f5e3";
        setTimeout(() => { tileEl.remove(); under.remove(); }, 250);
        t.done = true;
        const otherTile = st.tiles.find((x) => x.id === t.id && x.type !== t.type);
        if (otherTile) otherTile.done = true;
        st.matched++;
        updateInfo();
        if (st.matched >= st.total) {
          st.endTime = Date.now();
          const secs = (st.endTime - st.startTime) / 1000;
          if (!matchBest || secs < matchBest) matchBest = secs;
          updateInfo();
        }
      } else {
        tileEl.style.transition = "left .2s, top .2s";
        tileEl.style.left = t.x + "%"; tileEl.style.top = t.y + "%";
        if (under) { under.style.background = "#fbdada"; setTimeout(() => (under.style.background = "#fff"), 300); }
        setTimeout(() => (tileEl.style.transition = ""), 200);
      }
    });
  });
}

function startMatchGame() {
  const words = shuffle(flashcardWords(matchPools)).slice(0, MATCH_MAX); // every word in the chosen lists (up to MATCH_MAX, picked at random)
  const tiles = [];
  words.forEach((w, i) => {
    tiles.push({ id: i, type: "jp", text: w.jp });
    tiles.push({ id: i, type: "en", text: w.en });
  });
  const shuffledTiles = shuffle(tiles);
  // Jittered-grid layout: spreads tiles evenly (avoiding heavy overlap) while still looking scattered.
  const cols = shuffledTiles.length > 16 ? 5 : 4;
  const rows = Math.ceil(shuffledTiles.length / cols);
  const cellW = 100 / cols;
  const cellH = 100 / rows;
  shuffledTiles.forEach((t, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    t.x = col * cellW + 1 + Math.random() * Math.max(cellW - 16, 2);
    t.y = row * cellH + 1 + Math.random() * Math.max(cellH - 12, 2);
  });
  const boardHeight = Math.max(420, rows * 78);
  matchState = { tiles: shuffledTiles, matched: 0, total: words.length, startTime: Date.now(), endTime: null, boardHeight };
}

// ===================== 6. TYPHOON GAME =====================
const TYPHOON_DIFFICULTY = {
  easy: { label: "Easy", delayMin: 7000, delayMax: 13000, accuracy: 0.35 },
  medium: { label: "Medium", delayMin: 5000, delayMax: 9000, accuracy: 0.55 },
  hard: { label: "Hard", delayMin: 3500, delayMax: 6500, accuracy: 0.75 },
  ultra: { label: "Ultra", delayMin: 2000, delayMax: 4000, accuracy: 0.92 }, // still floored well above instant — no faster than a quick Year 8 typist
};
let typhoonState = null;
let typhoonPools = []; // word lists chosen for the typhoon game: starts with none selected
let typhoonDirection = "jToE";
let typhoonMode = "pvc";
let typhoonDifficulty = "medium";

function buildHouses(numHouses) {
  const houses = [];
  for (let i = 0; i < numHouses; i++) {
    const isTyphoon = i < Math.round(numHouses * 0.15);
    houses.push({ id: i, isTyphoon, points: isTyphoon ? 0 : Math.floor(Math.random() * 16 + 5) * 10, revealed: false });
  }
  return shuffle(houses).map((h, i) => ({ ...h, id: i }));
}
function pickTyphoonWord(pool) { return pool[Math.floor(Math.random() * pool.length)]; }
function checkTyphoonAnswer(word, direction, value) {
  const v = value.trim().toLowerCase();
  if (!v) return false;
  if (direction === "jToE") return matchesAnyMeaning(v, word.en);
  const jpForm = word.jp.trim().toLowerCase();
  return v === jpForm || romajiMatches(v, word.kana || word.jp);
}

function renderTyphoon(app) {
  app.appendChild(el("h2", { class: "section-title", text: "Arcade — Typhoon Game" }));
  app.appendChild(el("p", { class: "section-desc", text: "Answer first to earn a house — but watch out, some houses hide typhoons that wipe your score!" }));

  if (!typhoonState || !typhoonState.started) {

    return;

  renderTyphoonGame(app);
}

// Sizes the house grid so the whole game (scores, word, houses, End Game button) fits in the window without scrolling.
function fitTyphoonGrid() {
  const grid = document.getElementById("typhoonGrid");
  if (!grid) return;
  const cont = document.querySelector(".container");
  if (cont) cont.style.paddingBottom = "16px";
  const items = Array.from(grid.children);
  const n = items.length;
  if (!n) return;
  const gap = 8;
  const W = grid.parentElement.clientWidth;
  const top = grid.getBoundingClientRect().top + window.scrollY;
  const endBtn = document.getElementById("typhoonEnd");
  const below = (endBtn ? endBtn.offsetHeight + 12 : 0) + 16 + 8; // button + container padding + breathing room
  const H = Math.max(window.innerHeight - top - below, 150);
  let best = { cell: 0, cols: 1 };
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cell = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows);
    if (cell > best.cell + 0.5) best = { cell, cols };
  }
  const size = Math.max(Math.min(Math.floor(best.cell), 120), 32);
  grid.style.gridTemplateColumns = "repeat(" + best.cols + ", " + size + "px)";
  items.forEach((b) => {
    b.style.width = size + "px";
    b.style.height = size + "px";
    b.style.fontSize = Math.round(size * (b.dataset.revealed === "1" ? 0.3 : 0.5)) + "px";
  });
}
window.addEventListener("resize", () => { if (view === "typhoon") fitTyphoonGrid(); });

function winnerLabel(st, who) {
  if (who === "computer") return "Computer";
  if (st.mode === "pvc") return "You";
  return who === "P1" ? "Player 1" : "Player 2";
}

function renderTyphoonTopCard(topCard, st) {
  const word = st.currentWord;
  const prompt = st.direction === "jToE" ? word.jp : word.en;

  if (st.phase === "revealing") {
    const r = st.lastReveal;
    topCard.appendChild(el("div", { style: "font-size:1.2rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:14px;", text: r.isTyphoon ? `🌀 Typhoon! ${winnerLabel(st, r.winner)}'s score is wiped.` : `+${r.points} points for ${winnerLabel(st, r.winner)}!` }));
    topCard.appendChild(el("button", { class: "btn pink", style: "display:block;margin:0 auto;", text: "Continue →", onclick: continueAfterReveal }));
    return;
  }

  if (st.phase === "selecting-house") {
    topCard.appendChild(el("div", { class: st.direction === "jToE" ? "jp" : "", style: "font-size:1.6rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:6px;", text: prompt }));
    topCard.appendChild(el("div", { style: "text-align:center;font-weight:700;color:var(--green);", text: `✓ ${winnerLabel(st, st.pendingWinner)} got it! Select a house below.` }));
    return;
  }

  if (st.phase === "pvp-judge") {
    topCard.appendChild(el("div", { class: st.direction === "jToE" ? "jp" : "", style: "font-size:1.6rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:10px;", text: prompt }));
    topCard.appendChild(el("div", { style: "text-align:center;margin-bottom:10px;" }, [
      el("span", { class: "small", text: "Answer: " }),
      el("span", { class: word.jp && st.direction === "eToJ" ? "jp" : "", style: "font-weight:800;color:var(--pink);", text: st.direction === "jToE" ? word.en : word.jp + (word.kana ? " (" + kanaToRomaji(word.kana) + ")" : "") }),
    ]));
    const btnRow = el("div", { style: "display:flex;gap:10px;justify-content:center;flex-wrap:wrap;" });
    btnRow.appendChild(el("button", { class: "btn pink", text: "Player 1 got it ✓", onclick: () => { st.pendingWinner = "P1"; st.phase = "selecting-house"; renderApp(); } }));
    btnRow.appendChild(el("button", { class: "btn pink", text: "Player 2 got it ✓", onclick: () => { st.pendingWinner = "P2"; st.phase = "selecting-house"; renderApp(); } }));
    btnRow.appendChild(el("button", { class: "btn secondary", text: "Nobody — skip round", onclick: () => { nextTyphoonRound(st); renderApp(); } }));
    topCard.appendChild(btnRow);
    return;
  }

  // phase === "answering"
  topCard.appendChild(el("div", { class: st.direction === "jToE" ? "jp" : "", style: "font-size:1.8rem;font-weight:800;color:var(--navy);text-align:center;margin-bottom:14px;", text: prompt }));

  if (st.mode === "pvp") {
    topCard.appendChild(el("div", { class: "small", style: "text-align:center;margin-bottom:12px;", text: "Say the answer out loud — first to say it correctly wins the round!" }));
    const revealBtn = el("button", { class: "btn pink", style: "display:block;margin:0 auto;", text: "🔔 Reveal Answer", onclick: () => { st.phase = "pvp-judge"; renderApp(); } });
    topCard.appendChild(revealBtn);
    return;
  }

  // PvC: two side-by-side fields
  const row = el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:14px;" });
  const youCol = el("div", {});
  youCol.appendChild(el("div", { class: "small", style: "font-weight:700;margin-bottom:6px;", text: "Your answer" }));
  const input = el("input", { type: "text", placeholder: st.direction === "jToE" ? "Type the English meaning..." : "Type in Japanese or romaji...", style: "width:100%;", autofocus: "true" });
  if (st.pendingInputValue) { input.value = st.pendingInputValue; st.pendingInputValue = ""; }
  const feedback = el("div", { class: "small", style: "margin-top:6px;min-height:18px;" });
  youCol.appendChild(input);
  youCol.appendChild(feedback);
  row.appendChild(youCol);

  const compCol = el("div", {});
  compCol.appendChild(el("div", { class: "small", style: "font-weight:700;margin-bottom:6px;", text: "Computer" }));
  compCol.appendChild(el("div", { class: "small", id: "typhoonComputerStatus", style: "padding:8px 0;", text: st.computerStatus || "🤔 thinking..." }));
  row.appendChild(compCol);
  topCard.appendChild(row);

  function submit() {
    if (checkTyphoonAnswer(st.currentWord, st.direction, input.value)) {
      if (st.computerTimerId) { clearTimeout(st.computerTimerId); st.computerTimerId = null; }
      st.pendingWinner = "P1";
      st.phase = "selecting-house";
      renderApp();
    } else {
      feedback.textContent = "✗ Not quite — try again!";
      feedback.style.color = "var(--red)";
      input.value = "";
    }
  }
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  const submitBtn = el("button", { class: "btn pink", style: "margin-top:8px;", text: "Submit", onclick: submit });
  youCol.appendChild(submitBtn);

  // Schedule the computer's single attempt for this round, once.
  if (!st.computerTimerId) {
    const conf = TYPHOON_DIFFICULTY[st.difficulty];
    const delay = conf.delayMin + Math.random() * (conf.delayMax - conf.delayMin);
    st.computerTimerId = setTimeout(() => {
      if (typhoonState !== st || st.phase !== "answering") return; // round already resolved or game restarted
      st.computerTimerId = null;
      const correct = Math.random() < conf.accuracy;
      if (correct) {
        computerAutoPickHouse();
      } else {
        const wrongGuess = st.direction === "jToE" ? shuffle(st.wordPool.map((w) => w.en)).find((e) => e !== st.currentWord.en) : shuffle(st.wordPool.map((w) => w.jp)).find((j) => j !== st.currentWord.jp);
        st.computerStatus = "✗ guessed: " + (wrongGuess || "...");
        // Preserve whatever the student was mid-typing before we refresh the view.
        const liveInput = document.querySelector("#app input[type=text]");
        if (liveInput) st.pendingInputValue = liveInput.value;
        renderApp();
        setTimeout(() => { const li = document.querySelector("#app input[type=text]"); if (li) { li.focus(); li.setSelectionRange(li.value.length, li.value.length); } }, 0);
      }
    }, delay);
  }
}

function revealHouse(house, winner) {
  const st = typhoonState;
  house.revealed = true;
  const scoreKey = winner === "computer" ? "P2" : winner; // the scoreboard shows the computer's score under P2
  if (house.isTyphoon) st.scores[scoreKey] = 0;
  else st.scores[scoreKey] = (st.scores[scoreKey] || 0) + house.points;
  st.lastReveal = { isTyphoon: house.isTyphoon, points: house.points, winner };
  st.phase = "revealing";
  st.pendingWinner = null;
  renderApp();
}
function claimHouse(house) {
  revealHouse(house, typhoonState.pendingWinner);
}
function computerAutoPickHouse() {
  const st = typhoonState;
  const unclaimed = st.houses.filter((h) => !h.revealed);
  const house = unclaimed[Math.floor(Math.random() * unclaimed.length)];
  revealHouse(house, "computer");
}
function continueAfterReveal() {
  const st = typhoonState;
  if (st.houses.every((h) => h.revealed)) st.phase = "gameover";
  else nextTyphoonRound(st);
  renderApp();
}
function nextTyphoonRound(st) {
  st.currentWord = pickTyphoonWord(st.wordPool);
  st.phase = "answering";
  st.computerTimerId = null;
  st.computerStatus = "";
  st.pendingWinner = null;
}

// ===================== 7. ASTEROID TYPING =====================
const ASTEROID_LEVELS = [
  { speed: 0.05, spawnChance: 0.008, label: "Level 1" },
  { speed: 0.07, spawnChance: 0.011, label: "Level 2" },
  { speed: 0.09, spawnChance: 0.014, label: "Level 3" },
  { speed: 0.12, spawnChance: 0.018, label: "Level 4" },
  { speed: 0.16, spawnChance: 0.022, label: "Level 5" },
];
let asteroidState = null;
let asteroidPools = []; // word lists chosen for asteroid typing: starts with none selected
let asteroidStartLevel = 1;
let asteroidMode = "romaji";
function renderAsteroid(app) {
  app.appendChild(el("h2", { class: "section-title", text: "Arcade — Asteroid Typing" }));
  app.appendChild(el("p", { class: "section-desc", text: "Type the reading (or meaning) of the highlighted (pink) asteroid before it crosses the danger line!" }));

  if (!asteroidState || !asteroidState.started) {
    renderAsteroidSetup(app);
    return;
  }

  const st = asteroidState;
  const statsRow = el("div", { class: "small", style: "margin-bottom:8px;font-weight:700;" });
  app.appendChild(statsRow);
  const gameArea = el("div", { style: "position:relative;width:100%;height:480px;background:linear-gradient(#041E42,#1a407a);border-radius:12px;overflow:hidden;" });
  app.appendChild(gameArea);
  const dangerLine = el("div", { style: "position:absolute;bottom:66px;left:0;right:0;height:2px;background:#E13B82;" });
  gameArea.appendChild(dangerLine);
  const ship = el("div", { style: "position:absolute;bottom:32px;left:50%;font-size:1.8rem;transform:translateX(-50%);", text: "🚀" });
  gameArea.appendChild(ship);

  // Typing box and controls live inside the game field itself, as a control bar along the bottom.
  const controlBar = el("div", { style: "position:absolute;left:0;right:0;bottom:0;background:rgba(4,30,66,0.85);padding:10px 12px;display:flex;gap:8px;align-items:center;" });
  const input = el("input", { type: "text", placeholder: st.mode === "translation" ? "Type the English meaning..." : "Type romaji here...", autofocus: "true", style: "flex:1;" });
  const pauseBtn = el("button", { class: "btn secondary", style: "flex-shrink:0;", text: st.paused ? "▶ Resume" : "⏸ Pause" });
  const quitBtn = el("button", { class: "btn secondary", style: "flex-shrink:0;", text: "End Game", onclick: () => { asteroidState.started = false; asteroidState.running = false; renderApp(); } });
  controlBar.appendChild(input); controlBar.appendChild(pauseBtn); controlBar.appendChild(quitBtn);
  gameArea.appendChild(controlBar);

  const levelConf = ASTEROID_LEVELS[st.level - 1];
  function updateStats() { statsRow.textContent = `${levelConf.label}   ·   Lives: ${"❤️".repeat(Math.max(st.lives, 0))}   ·   Hits: ${st.hits}   ·   Mode: ${st.mode === "translation" ? "Translation" : "Romaji"}`; }
  updateStats();

  let raf = null;
  function spawnAsteroid() {
    const word = st.wordPool[Math.floor(Math.random() * st.wordPool.length)];
    st.asteroids.push({ jp: word.jp, kana: word.kana || word.jp, en: word.en, x: Math.random() * 80 + 5, y: -5 });
  }
  function loop() {
    if (!st.running) { finishGame(); return; }
    if (st.paused) return; // resume() calls loop() again to restart the animation
    const conf = ASTEROID_LEVELS[st.level - 1];
    st.asteroids.forEach((a) => (a.y += conf.speed));
    st.asteroids = st.asteroids.filter((a) => {
      if (a.y >= 86) {
        st.lives--; updateStats();
        if (st.lives <= 0) { st.running = false; }
        return false;
      }
      return true;
    });
    if (Math.random() < conf.spawnChance) spawnAsteroid();
    draw();
    raf = requestAnimationFrame(loop);
  }
  function targetAsteroid() { return st.asteroids.reduce((best, a) => (!best || a.y > best.y ? a : best), null); }
  function draw() {
    gameArea.querySelectorAll(".asteroid").forEach((e) => e.remove());
    const target = targetAsteroid();
    st.asteroids.forEach((a) => {
      const isTarget = a === target;
      const label = a.jp;
      const d = el("div", { class: "asteroid jp", style: `position:absolute;left:${a.x}%;top:${a.y}%;max-width:140px;font-size:1.05rem;font-weight:800;color:${isTarget ? "#E13B82" : "#fff"};white-space:nowrap;`, text: label });
      gameArea.appendChild(d);
    });
  }
  function finishGame() {
    updateStats();
    const over = el("div", { style: "position:absolute;inset:0;background:rgba(4,30,66,0.85);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:1.3rem;gap:14px;", text: "Game Over — " + st.hits + " hits!" });
    const again = el("button", { class: "btn pink", style: "font-size:.85rem;", text: "Back to Setup", onclick: () => { asteroidState.started = false; renderApp(); } });
    over.appendChild(again);
    gameArea.appendChild(over);
  }
  pauseBtn.onclick = () => {
    st.paused = !st.paused;
    if (!st.paused) { renderApp(); loop(); }
    else renderApp();
  };
  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || st.paused) return;
    const target = targetAsteroid();
    if (!target) return;
    const correct = st.mode === "translation" ? matchesAnyMeaning(input.value, target.en) : romajiMatches(input.value, target.kana);
    if (correct) {
      st.asteroids = st.asteroids.filter((a) => a !== target);
      st.hits++;
      if (st.hits % 8 === 0 && st.level < 5) st.level++;
      updateStats(); draw();
    }
    input.value = "";
  });
  if (st.paused) {
    input.disabled = true;
    const pausedOverlay = el("div", { style: "position:absolute;inset:0;bottom:56px;background:rgba(4,30,66,0.6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;", text: "⏸ Paused" });
    gameArea.appendChild(pausedOverlay);
  }
  draw();
  if (!st.paused) loop();
}

function renderAsteroidSetup(app) {
  const card = el("div", { class: "card", style: "max-width:560px;" });
  card.appendChild(listPicker(asteroidPools, (keys) => { asteroidPools = keys; renderApp(); }, "words"));
  card.appendChild(el("div", { style: "height:18px;" }));

  card.appendChild(el("div", { style: "font-weight:800;color:var(--navy);margin-bottom:10px;", text: "Starting level:" }));
  const levelRow = el("div", { style: "display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;" });
  ASTEROID_LEVELS.forEach((lvl, i) => {
    levelRow.appendChild(el("button", { class: "pool-btn" + (asteroidStartLevel === i + 1 ? " active" : ""), text: String(i + 1), onclick: () => { asteroidStartLevel = i + 1; renderApp(); } }));
  });
  card.appendChild(levelRow);
  card.appendChild(el("div", { class: "small", style: "margin-bottom:16px;", text: "Level 1 is slow and gentle; the game speeds up automatically as you get hits, up to Level 5. Starting higher skips the easier levels." }));

  card.appendChild(el("div", { style: "font-weight:800;color:var(--navy);margin-bottom:10px;", text: "Typing mode:" }));
  const modeRow = el("div", { style: "display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap;" });
  [["romaji", "Romaji Mode"], ["translation", "Translation Mode"]].forEach(([id, label]) => {
    modeRow.appendChild(el("button", { class: "pool-btn" + (asteroidMode === id ? " active" : ""), text: label, onclick: () => { asteroidMode = id; renderApp(); } }));
  });
  card.appendChild(modeRow);
  card.appendChild(el("div", { class: "small", style: "margin-bottom:20px;", text: asteroidMode === "translation" ? "You'll see the Japanese word and type its English meaning." : "You'll see the Japanese word and type its romaji reading." }));

  const noneChosen = asteroidPools.length === 0;
  const startBtn = el("button", { class: "btn pink", id: "asteroidStart", disabled: noneChosen, text: "Start Game", onclick: () => {
    if (!asteroidPools.length) return;
    const wordPool = flashcardWords(asteroidPools);
    asteroidState = { started: true, running: true, paused: false, level: asteroidStartLevel, mode: asteroidMode, asteroids: [], hits: 0, lives: 3, wordPool };
    renderApp();
  } });
  card.appendChild(startBtn);
  if (noneChosen) card.appendChild(el("div", { class: "small", style: "margin-top:8px;", text: "Choose at least one word list to start." }));
  app.appendChild(card);
}
renderTabs(); renderApp();

</script>
